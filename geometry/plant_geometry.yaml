# Meal pipes C1-C5 (user decision, 16 Nov 2026: scale the one literature
# pipe, the calciner's feed pipe, by equal mass flux). The flows are the
# twin's (feed 89.7 kg/s over 2 strings; C5's meal to the kiln 60.41 kg/s).
# ---------------------------------------------------------------------
meal_pipe:
  feed_per_string:     {value: 44.85,   unit: kg/s,  source: model,       doc: preheater/meal_pipe_C4.md}
  c5_meal_per_string:  {value: 30.2123, unit: kg/s,  source: model,       doc: preheater/meal_pipe_C5.md}

# ---------------------------------------------------------------------
# Layout: where the equipment stands. No source gives any of it; it
# only lays the plant out (geometry/plant_topology.md). Elevations of
# the cyclones then follow from their CFD domains (each roof flush with
# the top of the outlet bend below it).
# ---------------------------------------------------------------------
layout:
  kiln_axis_z:         {value: 10.0, unit: m,     source: schematic,    doc: plant_topology.md}
  chamber_margin:      {value: 1.0,  unit: m,     source: model,        doc: kiln/kiln_inlet_chamber.md}
  c5_over_tertiary_air: {value: 1.75, unit: m,    source: schematic,    doc: plant_topology.md}
  gooseneck_to_c5_gap: {value: 1.0,  unit: m,     source: schematic,    doc: plant_topology.md}
  # C1's dust outlets over the top of C2's outlet pipe. Since R1 rises
  # straight on C2's axis (17 Nov 2026) the twin stand over C2, and both
  # C1 meal pipes run back to R2's upright at the inner column (60 deg,
  # the near one joining at 50 deg): 9.41 m is the least that reaches it
  # (plant_topology_2d.bas checks). 4.0 while R1 stood over C2's leg.
  stage_gap:           {value: 9.5,  unit: m,     source: schematic,    doc: plant_topology.md}
  column_offset:       {value: 15.0, unit: m,     source: schematic,    doc: plant_topology.md}
  # the twin C1 (mirror pair, inlet ducts facing each other, R1 on the
  # mirror plane in front): clear gap between the two branches' walls,
  # two lined walls (~0.3 m each) and access; the spacing and R1's Y
  # follow from it (plant_geometry.c1_twin). No source gives either.
  c1_twin_gap:         {value: 1.0,  unit: m,     source: model,        doc: preheater/riser_R1.md}
  r1_up_min:           {value: 0.5,  unit: m,     source: schematic,    doc: plant_topology.md}
  # R1 straight up out of C2's outlet pipe, on C2's axis (user decision,
  # 17 Nov 2026; before, C2's CFD bend and leg turned it over to R1's
  # elbow): a conical reducer D_x 4.63 -> R1 3.07 at this half angle,
  # the drawing's 45 deg pieces (contraction loss ~3 Pa).
  r1_reducer_deg:      {value: 45.0, unit: deg,   source: schematic,    doc: plant_topology.md}
  cooler_drop:         {value: 1.0,  unit: m,     source: schematic,    doc: plant_topology.md}
