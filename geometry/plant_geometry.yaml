kiln_hood:
  secondary_air_flow:  {value: 26.246, unit: kg/s,   source: model,       doc: kiln/kiln_hood.md}
  air_velocity_min:    {value: 4.0,    unit: m/s,    source: literature,  doc: kiln/kiln_hood.md}
  air_velocity_max:    {value: 10.0,   unit: m/s,    source: literature,  doc: kiln/kiln_hood.md}
kiln_inlet_chamber:
