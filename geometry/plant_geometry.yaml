# THE plant's geometry: every PRIMARY dimension, written here once.
#
# Single-source rule (user decision, 13-14 Oct 2026): a dimension is
# written in this file and nowhere else. Volumes, areas, heights,
# elevations and ratios times diameters are DERIVED, in
# geometry/plant_geometry.py, and never written here. The twin
# (main.load_cfg), the SolidWorks macros (generated Const blocks) and
# the equipment docs (generated table blocks) all read from there;
# tools/gen_geometry.py writes the copies and checks them.
#
# Every entry: value, unit, source, doc.
#   source  published              a vendor or catalogue figure (HFC2500, PF5000)
#           derived_from_reference a published figure x an FLS reference ratio
#           literature             a literature value (named in doc)
#           cfd_decision           a user decision for the CFD, departing from the catalogue
#           model                  a modelling parameter, not a plant dimension (a CFD face, a split)
#           schematic              no source; it only lays the plant out
#   doc     the equipment document (under geometry/) that gives the reason
#
# SI units. The plant is two identical 2500 t/d strings, 5000 t/d in all
# (user decision, 12 Oct 2026); per-string equipment is given once.

plant:
  strings: {value: 2, unit: "-", source: cfd_decision, doc: catalog.md}

# ---------------------------------------------------------------------
# Cyclones. C1 and C4 are the two CFD domains (geometry/macros/cyclone.bas
# builds them from these). C2 = C3 = C4. C5 = C4 x scale, nothing of its
# own. Heights are from the dust outlet; the outlet pipe's lengths are
# ratios of the vortex finder diameter.
# ---------------------------------------------------------------------
cyclones:
  C1:
    per_string:        {value: 2,    unit: "-",   source: published,    doc: preheater/cyclone_C1.md}
    D_barrel:          {value: 4.32, unit: m,     source: published,    doc: preheater/cyclone_C1.md}
    H_barrel:          {value: 6.79, unit: m,     source: derived_from_reference, doc: preheater/cyclone_C1.md}
    H_cone:            {value: 4.65, unit: m,     source: derived_from_reference, doc: preheater/cyclone_C1.md}
    # Inlet re-sized for the plant's flow (user decision, 16 Nov 2026):
    # a volute, a = 3.00 m (17.9 m/s at 28.76 kg/s per C1) and S/a 1.15,
    # as C4. The FLS ratios gave S 2.16 and a 4.97 (cyclone_C1.md).
    L_vortex:          {value: 3.45, unit: m,     source: cfd_decision, doc: preheater/cyclone_C1.md}
    # Vortex finder = the riser rising out of it, and D / D_riser = 2.0
    # (user decision, 21 Nov 2026): D_x = 0.5 D, derived. The FLS ratio
    # gave D_x 2.40 (C1) and 4.63 (C4).
    D_vortex_over_D_barrel: {value: 0.5, unit: "-", source: cfd_decision, doc: preheater/cyclone_C1.md}
    D_dust:            {value: 0.4,  unit: m,     source: derived_from_reference, doc: preheater/cyclone_C1.md}
    W_inlet:           {value: 0.86, unit: m,     source: derived_from_reference, doc: preheater/cyclone_C1.md}
    H_inlet:           {value: 3.0,  unit: m,     source: cfd_decision, doc: preheater/cyclone_C1.md}
    inlet_slope:       {value: 0.0,  unit: deg,   source: cfd_decision, doc: preheater/cyclone_C1.md}
    volute:            {value: true, unit: "-",   source: cfd_decision, doc: preheater/cyclone_C1.md}
    outlet_turn:       {value: 180.0, unit: deg,  source: cfd_decision, doc: preheater/cyclone_C1.md}
    outlet_rise_over_Dx: {value: 1.25, unit: "-", source: model,        doc: preheater/cyclone_C1.md}
    outlet_bend_R_over_Dx: {value: 1.5, unit: "-", source: model,       doc: preheater/cyclone_C1.md}
    outlet_run_over_Dx:  {value: 1.25, unit: "-", source: model,        doc: preheater/cyclone_C1.md}
    # the mesh sizing cylinder inside the vortex finder's bore, ~2/3 of
    # its radius (0.8 at D_x 2.40; 21 Nov 2026 with D_x = D / 2)
    boi_radius:        {value: 0.72, unit: m,     source: model,        doc: preheater/cyclone_C1.md}
  C4:
    per_string:        {value: 1,    unit: "-",   source: published,    doc: preheater/cyclone_C4.md}
    D_barrel:          {value: 6.3,  unit: m,     source: published,    doc: preheater/cyclone_C4.md}
    H_barrel:          {value: 6.3,  unit: m,     source: cfd_decision, doc: preheater/cyclone_C4.md}
    H_cone:            {value: 7.3,  unit: m,     source: derived_from_reference, doc: preheater/cyclone_C4.md}
    L_vortex:          {value: 3.9,  unit: m,     source: cfd_decision, doc: preheater/cyclone_C4.md}
    D_vortex_over_D_barrel: {value: 0.5, unit: "-", source: cfd_decision, doc: preheater/cyclone_C4.md}
    D_dust:            {value: 0.81, unit: m,     source: derived_from_reference, doc: preheater/cyclone_C4.md}
    W_inlet:           {value: 2.912, unit: m,    source: cfd_decision, doc: preheater/cyclone_C4.md}
    H_inlet:           {value: 3.4,  unit: m,     source: cfd_decision, doc: preheater/cyclone_C4.md}
    inlet_slope:       {value: 0.0,  unit: deg,   source: cfd_decision, doc: preheater/cyclone_C4.md}
    volute:            {value: true, unit: "-",   source: cfd_decision, doc: preheater/cyclone_C4.md}
    # R2-R4 (user decision, 17 Nov 2026): each riser is the cyclone
    # below's outlet pipe, straight up beside the one above, turning
    # into a short level duct and the volute through an inclined
    # flat-faced duct (cyclone_domain.riser_duct_slope_deg; 22 Nov
    # 2026). So the outlet does not turn (0: a
    # straight pipe outlet_rise over the roof, the CFD domain's end;
    # until then a 90 deg bend R 1.0 D_x and a 1.0 D_x leg), the level
    # duct is inlet_duct_length (3.0 m before; 1.0 m on 17 Nov; 2.0 m
    # user decision 21 Nov 2026, the 1.0 m looked too short) and a riser
    # comes in under it (inlet_riser; C1 keeps its own branch, cyclone.bas RISER_ON).
    outlet_turn:       {value: 0.0,  unit: deg,   source: cfd_decision, doc: preheater/cyclone_C4.md}
    outlet_rise_over_Dx: {value: 1.7, unit: "-",  source: cfd_decision, doc: preheater/cyclone_C4.md}
    inlet_duct_length: {value: 2.0,  unit: m,     source: cfd_decision, doc: preheater/cyclone_C4.md}
    inlet_riser:       {value: true, unit: "-",   source: cfd_decision, doc: preheater/cyclone_C4.md}
    boi_radius:        {value: 1.0,  unit: m,     source: model,        doc: preheater/cyclone_C4.md}
  C2: {same_as: C4, per_string: {value: 1, unit: "-", source: published, doc: preheater/cyclone_C2.md}}
  C3: {same_as: C4, per_string: {value: 1, unit: "-", source: published, doc: preheater/cyclone_C3.md}}
  C5:
    scaled_from: C4
    # its published D 6.50 over C4's 6.30: every length of the C4 domain
    # scales, so C4's Euler number and volute swirl carry over
    D_barrel_published: {value: 6.5, unit: m,     source: published,    doc: preheater/cyclone_C5.md}
    per_string:        {value: 1,    unit: "-",   source: published,    doc: preheater/cyclone_C5.md}
    boi_radius:        {value: 1.03, unit: m,     source: model,        doc: preheater/cyclone_C5.md}

# Parts of the cyclone CFD domains that are not per cyclone
# (geometry/macros/cyclone.bas)
cyclone_domain:
  vortex_wall:         {value: 0.08, unit: m,     source: model,        doc: preheater/cyclone_C1.md}
  inlet_duct_length:   {value: 3.0,  unit: m,     source: model,        doc: preheater/cyclone_C4.md}
  inlet_roof_clearance: {value: 0.05, unit: m,    source: model,        doc: preheater/cyclone_C1.md}
  inlet_tangent_relief: {value: 0.0, unit: m,     source: model,        doc: preheater/cyclone_C1.md}
  volute_tongue:       {value: 0.05, unit: m,     source: model,        doc: preheater/cyclone_C4.md}
  volute_overlap:      {value: 0.1,  unit: m,     source: model,        doc: preheater/cyclone_C4.md}
  # C1's own riser branch: half of R1's area each, R1 below the twin
  c1_riser_area_share: {value: 0.5,  unit: "-",   source: cfd_decision, doc: preheater/riser_R1.md}
  c1_riser_transition: {value: 1.5,  unit: m,     source: model,        doc: preheater/riser_R1.md}
  c1_riser_bend_R_over_D: {value: 1.0, unit: "-", source: model,        doc: preheater/riser_R1.md}
  c1_riser_above_feed: {value: 3.0,  unit: m,     source: model,        doc: preheater/riser_R1.md}
  c1_riser_below_feed: {value: 4.5,  unit: m,     source: model,        doc: preheater/riser_R1.md}
  c1_feed_width:       {value: 0.6,  unit: m,     source: literature,   doc: preheater/riser_R1.md}
  c1_feed_height:      {value: 0.6,  unit: m,     source: literature,   doc: preheater/riser_R1.md}
  c1_feed_depth:       {value: 1.0,  unit: m,     source: model,        doc: preheater/riser_R1.md}
  meal_slope:          {value: 60.0, unit: deg,   source: literature,   doc: calciner/calciner.md}
  # R2-R4 into C2-C4 (and the C4 domain's own inlet), as a plant has
  # them (user decision, 22 Nov 2026, from a plant image: "aynısını
  # yapalım"): the round riser goes straight up under the level duct's
  # axis and a flat-faced rectangular duct climbs from it at
  # riser_duct_slope_deg into the level duct, mitred to it. The riser's
  # top is cut by the inclined roof; the inclined floor, one plane of
  # constant slope, meets the riser's front half along half an ellipse
  # (the seam that looks parabolic). The inclined duct is the riser's D
  # wide at the riser (sides tangent to it, no step) and narrows to the
  # level duct's W at riser_taper_deg per side at most (a converging
  # duct; 15 deg as for the transitions before). Before (17-22 Nov): a
  # level duct with an elbow, a 45 deg loft before that. The riser axis
  # is as close to the face as the mitre, the taper and its radius allow
  # (plant_geometry.riser_duct_run_min), and riser_barrel_clearance
  # clear of the barrel; the CFD domain starts riser_cfd_stub_over_D
  # riser diameters below the seam. No source gives the slope (read off
  # the image), the clearance or the stub.
  riser_duct_slope_deg: {value: 45.0, unit: deg, source: schematic,   doc: preheater/cyclone_C4.md}
  riser_taper_deg:     {value: 15.0, unit: deg,   source: cfd_decision, doc: preheater/cyclone_C4.md}
  riser_barrel_clearance: {value: 0.3, unit: m,   source: model,        doc: preheater/cyclone_C4.md}
  riser_cfd_stub_over_D: {value: 1.0, unit: "-",  source: model,        doc: preheater/cyclone_C4.md}

# ---------------------------------------------------------------------
# Risers: the gas from C(k+1) up to C(k). R1-R4 are C2-C5's outlet
# pipes themselves, the vortex finder's bore carried straight up (user
# decisions, 14 Oct 2026 and, for R1, 21 Nov 2026: the published R1
# Ø3.07 and its reducer out of C2 are gone; the published Ø3.35-3.60
# risers are not this plant's). No riser bore is written here; the
# paths are derived: plant_geometry.stage_riser / r1_path.
# ---------------------------------------------------------------------

# ---------------------------------------------------------------------
# Calciner (ILC), PF5000, and its Y gooseneck
# ---------------------------------------------------------------------
calciner:
  D_shell:             {value: 7.2,  unit: m,     source: published,    doc: calciner/calciner.md}
  # the effective bore: the shell x FLS calciner_eff_over_shell 3.08 / 3.29
  # (catalog.md) = 6.740426, set at 0.1 mm as the CFD solid was built
  D:                   {value: 6.7404, unit: m,   source: derived_from_reference, doc: calciner/calciner.md}
  H:                   {value: 30.0, unit: m,     source: published,    doc: calciner/calciner.md}
  cone_angle:          {value: 65.0, unit: deg,   source: literature,   doc: calciner/calciner.md}
  # the throat is sized from a literature kiln-gas flow at a literature velocity
  throat_gas_flow:     {value: 61.44444444, unit: kg/s, source: literature, doc: calciner/calciner.md}
  throat_gas_T:        {value: 1323.15, unit: K,  source: literature,   doc: calciner/calciner.md}
  throat_gas_x_N2:     {value: 0.744, unit: mol/mol, source: literature, doc: calciner/calciner.md}
  throat_gas_x_O2:     {value: 0.076, unit: mol/mol, source: literature, doc: calciner/calciner.md}
  throat_gas_x_H2O:    {value: 0.05,  unit: mol/mol, source: literature, doc: calciner/calciner.md}
  throat_gas_x_CO2:    {value: 0.13,  unit: mol/mol, source: literature, doc: calciner/calciner.md}
  throat_velocity:     {value: 29.0, unit: m/s,   source: literature,   doc: calciner/calciner.md}
  throat_length_over_D: {value: 1.0, unit: "-",   source: model,        doc: calciner/calciner.md}
  D_tertiary_air:      {value: 2.4393, unit: m,   source: derived_from_reference, doc: calciner/calciner.md}
  # the literature flow it carries (Mikulcic 2012 TA + burner air, x 2;
  # 800 C, Kahawalage 2017) at a literature velocity (Chanamai 2019):
  # the duct above within 0.2 mm (it was sized at 54.92 kg/s), and the
  # CFD's tertiary air inlet
  tertiary_air_flow:   {value: 54.925, unit: kg/s, source: literature,  doc: calciner/calciner.md}
  tertiary_air_T:      {value: 1073.15, unit: K,  source: literature,   doc: calciner/calciner.md}
  tertiary_air_x_N2:   {value: 0.79, unit: mol/mol, source: literature, doc: calciner/calciner.md}
  tertiary_air_x_O2:   {value: 0.21, unit: mol/mol, source: literature, doc: calciner/calciner.md}
  tertiary_air_velocity: {value: 35.87, unit: m/s, source: literature,  doc: calciner/calciner.md}
  # The tertiary air duct enters at the bottom of the cylinder,
  # tangentially (Chen et al., a 5000 t/d in-line calciner; user
  # decision, 14 Oct 2026): its lower edge on the top of the cone and
  # its outer wall on the vessel's, each kept a hair clear so no two
  # surfaces of the boolean touch (cyclone.bas's inlet roof clearance,
  # the same reason). A stub of it, past the vessel's tangent plane.
  tertiary_air_cone_clearance: {value: 0.05, unit: m, source: model,   doc: calciner/calciner.md}
  tertiary_air_wall_relief: {value: 0.05, unit: m, source: model,      doc: calciner/calciner.md}
  tertiary_air_stub_length: {value: 3.0, unit: m,  source: model,      doc: calciner/calciner.md}
  # Meal and fuel just above the tertiary air (Chen et al.; the main
  # meal inlet above the tertiary air inlet, US 10,974,992): each pipe's
  # hole in the wall starts this far over the duct's top.
  feed_above_tertiary_air: {value: 1.0, unit: m,  source: model,       doc: calciner/calciner.md}
  D_feed:              {value: 0.8485, unit: m,   source: literature,   doc: calciner/calciner.md}
  feed_depth:          {value: 1.0,  unit: m,     source: model,        doc: calciner/calciner.md}
  # Fuel: Fidaros 2007's two 0.2 m coal pipes at 30 deg, x sqrt 2 for a
  # string each (as the meal pipes); at the meal's height, 90 deg round
  # from them (Chen et al.: coal and meal at one height, in different
  # directions)
  D_fuel:              {value: 0.2828, unit: m,   source: literature,   doc: calciner/calciner.md}
  fuel_slope:          {value: 30.0, unit: deg,   source: literature,   doc: calciner/calciner.md}
  # Dispersion plate under each meal pipe's hole (user decision, 16 Nov
  # 2026). Type: a curved (ski-jump) plate at the meal inlet's lower lip,
  # sticking out past the wall, throwing the meal near-horizontally into
  # the rising gas (KHD US 6,875,267: meal slide + deflector slide through
  # a wall opening; a manufacturer's video image the user supplied, 16 Nov
  # 2026). No source publishes its dimensions: all model values, the exit
  # angle read off that image. The plate starts tangent to the meal pipe's
  # 60 deg slope lip_clearance below the hole's lowest point (no sliver of
  # wall between them), turns on one arc to exit_angle above the horizontal
  # and ends protrusion past the wall; its tail runs on tail along the pipe
  # slope into the wall so its back end is clear of the vessel.
  dispersion_plate_exit_angle: {value: 10.0, unit: deg, source: model,  doc: calciner/calciner.md}
  dispersion_plate_protrusion_over_D_feed: {value: 0.5, unit: "-", source: model, doc: calciner/calciner.md}
  dispersion_plate_width_over_D_feed: {value: 1.0, unit: "-", source: model, doc: calciner/calciner.md}
  dispersion_plate_thickness: {value: 0.05, unit: m, source: model,     doc: calciner/calciner.md}
  dispersion_plate_lip_clearance: {value: 0.05, unit: m, source: model, doc: calciner/calciner.md}
  dispersion_plate_tail: {value: 0.1, unit: m,     source: model,       doc: calciner/calciner.md}

gooseneck:
  D_leg:               {value: 3.5,  unit: m,     source: published,    doc: preheater/gooseneck.md}
  # The neck: three straight pieces over the vessel's top (user decision,
  # 15 Nov 2026, replacing the Y straight on the roof): one rising from
  # the roof at neck_slope, one level (0 deg), one dropping at neck_slope,
  # each pipe the next one's mitre. Lengths are model choices (no
  # source), in neck diameters; the roof's middle is the first piece's
  # axis; the neck bends forward (-y), so it comes down in front of the
  # vessel.
  neck_slope:              {value: 45.0, unit: deg, source: model, doc: preheater/gooseneck.md}
  neck_piece_over_D_neck:  {value: 1.0,  unit: "-", source: model, doc: preheater/gooseneck.md}
  neck_level_over_D_neck:  {value: 1.0,  unit: "-", source: model, doc: preheater/gooseneck.md}
  # Below the third piece the neck goes on as one vertical channel of its
  # own diameter, its length in neck diameters (model choice, user
  # decision 15 Nov 2026: one straight channel first, the Y below it).
  channel_over_D_neck:     {value: 1.5,  unit: "-", source: model, doc: preheater/gooseneck.md}
  # The Y: from the channel's lower end each arm leaves in the plane across
  # the channel (x-z), at arm_angle from the vertical (user decision, 15 Nov
  # 2026), runs one straight piece down, and turns (mitre) to a level run
  # (at C5's inlet axis: plant_geometry.gooseneck()).
  arm_angle:               {value: 60.0, unit: deg, source: model, doc: preheater/gooseneck.md}
  # The arm's inclined piece runs down to the level run's axis (C5's
  # inlet axis), so its length follows; the level run then goes on, in leg
  # diameters, to the outlet face (user's sketch, 15 Nov 2026).
  arm_run_over_D_leg:      {value: 2.0,  unit: "-", source: model, doc: preheater/gooseneck.md}

# ---------------------------------------------------------------------
# Rotary kiln, PF5000
# ---------------------------------------------------------------------
kiln:
  D:                   {value: 4.8,  unit: m,     source: published,    doc: kiln/kiln.md}
  # Length: 60 m (user decision, 23 Nov 2026), not PF5000's published
  # 74 m. 74 m (L/D 15.4 on the 4.8 m bore, ~17 inside a real lining) is
  # a first-generation three-base precalciner kiln's proportion; a modern
  # two-base kiln (the ROTAX-2 this model's parts follow) runs L/D 10-13
  # (Techniques de l'Ingenieur BE8845; FLS kiln brochure: 2-base ~13 D,
  # 3-base ~17 D, 5.3 vs 5.0 t/(d m3)). 4.8 x 60 m: L/D 12.5, 4.61 t/(d m3)
  # for 5000 t/d; D stays the flow bore (lining and shell outward).
  L:                   {value: 60.0, unit: m,     source: cfd_decision, doc: kiln/kiln.md}
  slope:               {value: 3.0,  unit: "%",   source: published,    doc: kiln/kiln.md}
  # the back end the twin's transition zone solves (25/60 of the tube)
  transition_L:        {value: 25.0, unit: m,     source: model,        doc: kiln/kiln.md}
  # The clinker bed in the burning zone (the flame volume's floor; user,
  # 23 Nov 2026: fill by continuity, a flat surface at the dynamic angle
  # of repose). Fill = clinker flow x transit time / bulk density over
  # the zone's bore, the transit Sullivan's (physics.rotary_bed_motion).
  # - the plant's 5000 t/d of clinker (user decision, 12 Oct 2026)
  clinker_flow:        {value: 57.8704, unit: kg/s, source: cfd_decision, doc: kiln/kiln.md}
  # - the twin's speed (configs/twin_cfg.yaml motion.rpm_default; the
  #   PF5000 drive turns 0.6-4.0 rpm; 3.0 rpm keeps the 60 m tube's
  #   transit at 27.1 min, inside the 25-35 min band; user, 23 Nov 2026)
  rpm:                 {value: 3.0,  unit: rpm,   source: model,        doc: kiln/kiln.md}
  # - dynamic angle of repose, raw meal / clinker (twin_cfg repose_angle_deg;
  #   1.77 sqrt(40) = the industry's 11.2 in t = 11.2 L/(r D s))
  repose_angle:        {value: 40.0, unit: deg,   source: literature,   doc: kiln/kiln.md}
  # - loose clinker bulk density: BIMCO solid bulk cargo database, cement
  #   clinkers 1190-1639 kg/m3; mid-range
  clinker_bulk_density: {value: 1400.0, unit: kg/m3, source: literature, doc: kiln/kiln.md}
  # - the bed rides up the wall on this side (+1: +x, the kiln frame);
  #   the rotation sense is not published: model
  bed_rise_side:       {value: 1.0,  unit: "-",   source: model,        doc: kiln/kiln.md}
  # The wall stack, hot face outward (physics/shell.py has the materials).
  # NOTE: the published 4.8 m is the SHELL diameter; the twin uses it as
  # the bore (user decision, 12 Oct 2026), so the stack is added outward:
  # D is the flow bore and the brick's hot face, in both zones (user,
  # 22 Nov 2026); one wall over the tube, the shell 5.30 m throughout
  # (kiln_wall.bas, plant_geometry.kiln()["wall"]). With the published
  # shell the real bore would be 4.8 - 2 (0.030 + 0.220) = 4.30 m (open
  # item, 15 Nov 2026).
  # Steel plate: welded kilns 25-35 mm (cementkilns.co.uk, "Design features
  # of rotary kilns"); tyre wrapper plates are local and not modelled.
  shell_t:             {value: 0.030, unit: m,    source: literature,   doc: kiln/kiln.md}
  # Brick ring: 220 mm for kiln diameters 4200-5200 mm (supplier table in
  # R. Mosci, "Lining thickness"); VDZ B222..B622 and ISO 222 shapes are
  # h = 220 mm (rotary kiln brick installation guideline). The basic
  # (burning) and alumina (transition) rings are the same thickness.
  lining_t:            {value: 0.220, unit: m,    source: literature,   doc: kiln/kiln.md}
  # The bricks of that ring: ISO 5417:1986 (confirmed 2022), Table 1,
  # rotary kiln bricks of constant cold face: A = 103 mm on the shell side,
  # L = 198 mm along the axis, for every H (160-250 mm); at H = 220 mm the
  # hot face B runs 88.0 (322) .. 97.3 (822) mm, and a ring is closed by a
  # mix of two shapes. The ring's count and its equivalent hot face follow
  # from these and the radii (plant_geometry.kiln()["wall"]).
  brick_cold_face:     {value: 0.103, unit: m,    source: literature,   doc: kiln/kiln.md}
  brick_length:        {value: 0.198, unit: m,    source: literature,   doc: kiln/kiln.md}
  # No clinker coating (user decision, 22 Nov 2026: no layer in the
  # drawings or the twin for now): the brick is the innermost layer.
  # The burning coating was 0.200 m (held the shell at Sadighi et al.
  # 2011's 190-220 C), the transition coating had no source.

# ---------------------------------------------------------------------
# The kiln's mechanical parts, FLS ROTAX-2 as the reference (user, 22 Nov
# 2026: the kiln's own dimensions stay, only these parts are added; simple
# envelopes). kiln_rotax.bas; not a CFD input, not a fabrication drawing.
# FLS publishes no ROTAX-2 dimension: what the user's ROTAX-2 3D model
# images (FLS) show is read as a ratio to the kiln's L or shell diameter
# (derived_from_reference); the rest is literature or schematic.
#   Two supports, tangentially suspended tyres on self-aligning rollers,
#   friction drive through the inlet station's two rollers (no girth
#   gear), hydraulic thrust device, graphite inlet and outlet seals
#   (fuller-technologies.com ROTAX-2 page; the user's images).
# ---------------------------------------------------------------------
kiln_rotax:
  # Tyre centres along the tube from the back end, read off the ROTAX-2
  # side view (shell ends to tyre centres). Span 0.52 L = 38.5 m = 7.3 x
  # the shell D: past the ~7 D a two-tyre kiln can carry (cementkilns.co.uk,
  # "Design features of rotary kilns") -- this kiln is longer (L/D 15) than
  # a two-support kiln (10-14); kept as the user's reference shows it.
  tyre_inlet_at:       {value: 0.33,  unit: "-",  source: derived_from_reference, doc: kiln/kiln.md}
  tyre_outlet_at:      {value: 0.85,  unit: "-",  source: derived_from_reference, doc: kiln/kiln.md}
  # Tyre ring: width and radial thickness about 0.17 and 0.085 x the
  # shell D in the images; the tangential suspension's brackets keep its
  # bore this far off the shell (bracket height, images).
  tyre_width:          {value: 0.90,  unit: m,    source: derived_from_reference, doc: kiln/kiln.md}
  tyre_thickness:      {value: 0.45,  unit: m,    source: derived_from_reference, doc: kiln/kiln.md}
  tyre_gap:            {value: 0.35,  unit: m,    source: derived_from_reference, doc: kiln/kiln.md}
  # Shell under the tyre: "triple-thickness shell under the tyre chairs"
  # (cementkilns.co.uk); its length about four tyre widths (images).
  # Modelled as the extra plate outside the shell (the shell's D stays).
  tyre_section_t:      {value: 0.090, unit: m,    source: literature,   doc: kiln/kiln.md}
  tyre_section_L:      {value: 3.60,  unit: m,    source: derived_from_reference, doc: kiln/kiln.md}
  # Tangential suspension: brackets round the shell (images: ~16), each
  # this wide, spanning the tyre and this far either side of it.
  bracket_n:           {value: 16,    unit: "-",  source: derived_from_reference, doc: kiln/kiln.md}
  bracket_w:           {value: 0.30,  unit: m,    source: schematic,    doc: kiln/kiln.md}
  bracket_overhang:    {value: 0.50,  unit: m,    source: schematic,    doc: kiln/kiln.md}
  # Support rollers: OD / tyre OD = 1500 / 4630 and 30 deg from the
  # vertical to each roller (Wisner, Metso, TAPPI PEERS 2019, worked
  # example; "rollers subtend 60 deg at the tyre centre", cementkilns.co.uk).
  # Wider than the tyre (cementkilns.co.uk; the margin has no source).
  roller_over_tyre:    {value: 0.324, unit: "-",  source: literature,   doc: kiln/kiln.md}
  roller_angle:        {value: 30.0,  unit: deg,  source: literature,   doc: kiln/kiln.md}
  roller_extra_width:  {value: 0.20,  unit: m,    source: schematic,    doc: kiln/kiln.md}
  roller_shaft_D:      {value: 0.60,  unit: m,    source: schematic,    doc: kiln/kiln.md}
  bearing_size:        {value: 1.00,  unit: m,    source: schematic,    doc: kiln/kiln.md}
  bearing_length:      {value: 0.70,  unit: m,    source: schematic,    doc: kiln/kiln.md}
  frame_t:             {value: 0.60,  unit: m,    source: schematic,    doc: kiln/kiln.md}
  # Concrete piers, down to the ground under the sloped axis
  # (layout.kiln_axis_z at the back end, kiln.slope): half width across
  # the kiln, half length along it; the inlet pier also carries the drive.
  pier_half_width:     {value: 4.50,  unit: m,    source: schematic,    doc: kiln/kiln.md}
  pier_half_length:    {value: 3.00,  unit: m,    source: schematic,    doc: kiln/kiln.md}
  # Friction drive at the inlet station: per roller a gearbox and a main
  # motor in line with the roller's shaft, on the back-end side (images).
  gearbox_D:           {value: 1.60,  unit: m,    source: schematic,    doc: kiln/kiln.md}
  gearbox_L:           {value: 1.40,  unit: m,    source: schematic,    doc: kiln/kiln.md}
  motor_size:          {value: 1.20,  unit: m,    source: schematic,    doc: kiln/kiln.md}
  motor_L:             {value: 2.00,  unit: m,    source: schematic,    doc: kiln/kiln.md}
  drive_gap:           {value: 0.40,  unit: m,    source: schematic,    doc: kiln/kiln.md}
  # Hydraulic thrust device: a horizontal roller on the inlet tyre's
  # hood-side face (images).
  htd_D:               {value: 1.40,  unit: m,    source: schematic,    doc: kiln/kiln.md}
  htd_t:               {value: 0.35,  unit: m,    source: schematic,    doc: kiln/kiln.md}
  # Seals (graphite blocks in a ring housing): radial depth and length
  # of each housing, over the shell end; two dust chutes under the outlet.
  # The outlet pier reaches the hood end (images: the platform under the
  # outlet seal and the nose ring fan).
  inlet_seal_depth:    {value: 0.65,  unit: m,    source: schematic,    doc: kiln/kiln.md}
  inlet_seal_L:        {value: 0.90,  unit: m,    source: schematic,    doc: kiln/kiln.md}
  outlet_seal_depth:   {value: 0.90,  unit: m,    source: schematic,    doc: kiln/kiln.md}
  outlet_seal_L:       {value: 1.30,  unit: m,    source: schematic,    doc: kiln/kiln.md}
  # (the chutes reach down to the outlet pier: their length follows)
  chute_D:             {value: 0.50,  unit: m,    source: schematic,    doc: kiln/kiln.md}
  # Shell cooling fans: three axial fans (images) on the walkway, blowing
  # up at the burning zone's shell, from this far before the outlet tyre,
  # this far apart; the nose ring fan under the outlet seal.
  fan_n:               {value: 3,     unit: "-",  source: derived_from_reference, doc: kiln/kiln.md}
  fan_D:               {value: 1.25,  unit: m,    source: schematic,    doc: kiln/kiln.md}
  fan_L:               {value: 1.60,  unit: m,    source: schematic,    doc: kiln/kiln.md}
  # each fan's outlet this far off the surface it cools (images: ~1 m)
  fan_clearance:       {value: 1.0,   unit: m,    source: derived_from_reference, doc: kiln/kiln.md}
  fan_first_before_tyre: {value: 15.0, unit: m,   source: schematic,    doc: kiln/kiln.md}
  fan_pitch:           {value: 4.0,   unit: m,    source: schematic,    doc: kiln/kiln.md}
  # Walkway truss between the piers, beside the kiln (images).
  walkway_width:       {value: 2.0,   unit: m,    source: schematic,    doc: kiln/kiln.md}
  walkway_depth:       {value: 1.2,   unit: m,    source: schematic,    doc: kiln/kiln.md}

# ---------------------------------------------------------------------
# Grate cooler: PF5000 grate area, FLS reference cooler width and height
# ---------------------------------------------------------------------
cooler:
  grate_area:          {value: 119.6, unit: m2,   source: published,    doc: cooler/cooler.md}
  width:               {value: 4.0,  unit: m,     source: literature,   doc: cooler/cooler.md}
  casing_height:       {value: 3.0,  unit: m,     source: literature,   doc: cooler/cooler.md}
  # FLS reference cooler's 10-segment model: the undergrate air's segments, and how many from the
  # hot end carry the hood's opening (segment 1 -> the kiln, 2 -> the tertiary air; both leave by the hood)
  segments:            {value: 10,   unit: "-",   source: literature,   doc: cooler/cooler.md}
  hood_segments:       {value: 2,    unit: "-",   source: literature,   doc: cooler/cooler.md}

# ---------------------------------------------------------------------
# Preheater ID fan (user decision, 16 Nov 2026: one per string, 8 kPa):
# the duty point is the twin's exhaust as it stood when the CFD solid
# was built (77c15ba, 15 Nov 2026), FROZEN there as a design duty
# (user decision, 15 Nov 2026): the fan's size follows from it by fan
# laws and no longer moves with every twin change. The twin is only
# checked to stay within +-5 K / +-2 % of it (tests/test_plant_geometry.py).
# No plant dimension is published (fan/id_fan.md).
# ---------------------------------------------------------------------
id_fan:
  per_string:          {value: 1,      unit: "-",     source: cfd_decision, doc: fan/id_fan.md}
  exhaust_flow_per_string: {value: 57.526, unit: kg/s, source: cfd_decision, doc: fan/id_fan.md}
  exhaust_T:           {value: 572.19, unit: K,       source: cfd_decision, doc: fan/id_fan.md}
  exhaust_molar_mass:  {value: 31.9,   unit: g/mol,   source: model,        doc: fan/id_fan.md}
  inlet_underpressure: {value: 4000.0, unit: Pa,      source: model,        doc: fan/id_fan.md}
  total_pressure:      {value: 8000.0, unit: Pa,      source: model,        doc: fan/id_fan.md}
  efficiency:          {value: 0.80,   unit: "-",     source: literature,   doc: fan/id_fan.md}
  speed:               {value: 1000.0, unit: rpm,     source: literature,   doc: fan/id_fan.md}
  pressure_coefficient: {value: 1.3,   unit: "-",     source: model,        doc: fan/id_fan.md}   # psi = 2 dp / (rho u2^2); 1.3 gives a wide wheel (b2/D2 0.20) like the user's reference fan photo (15 Nov 2026); no source
  motor_margin:        {value: 1.10,   unit: "-",     source: model,        doc: fan/id_fan.md}
  # The fan's flow path (user decisions, 15 Nov 2026): a fluid volume with
  # a bladed impeller in its own rotating (MRF) zone, an inlet box and cone,
  # a log-spiral volute sized by its outlet velocity and a plain discharge
  # 45 deg up (no evasé). Sources in fan/id_fan.md.
  eye_ratio:           {value: 0.70,   unit: "-",     source: literature,   doc: fan/id_fan.md}   # D1/D2, the top of 0.4-0.7 (IJTE 2022)
  blade_outlet_angle:  {value: 45.0,   unit: deg,     source: literature,   doc: fan/id_fan.md}   # beta2 from the tangent; Reitz's preheater ID fan, Senegal (552 000 m3/h, 980 rpm): 45 deg for dusty gas
  incidence:           {value: 3.0,    unit: deg,     source: model,        doc: fan/id_fan.md}   # blade inlet angle over the flow angle
  blade_number_coeff:  {value: 8.5,    unit: "-",     source: literature,   doc: fan/id_fan.md}   # z = k sin(beta2) / (1 - D1/D2) (IJTE 2022)
  blade_thickness:     {value: 0.012,  unit: m,       source: model,        doc: fan/id_fan.md}   # plate blade, no source
  blade_edge_clearance: {value: 0.001, unit: m,       source: model,        doc: fan/id_fan.md}   # blades stop this short of the eye and tip circles: their caps leave those edges whole (no sliver faces)
  hydraulic_efficiency: {value: 0.88,  unit: "-",     source: model,        doc: fan/id_fan.md}   # dp = eta_h rho u2 cu2
  volute_width_ratio:  {value: 3.0,    unit: "-",     source: literature,   doc: fan/id_fan.md}   # B / b2, the rule's 2-3 (ICME 2003: 2.14)
  tongue_gap_ratio:    {value: 0.075,  unit: "-",     source: literature,   doc: fan/id_fan.md}   # (r3 - r2) / D2, cut-off clearance 6-13 % (Reitz India, CII 2024)
  tongue_radius_ratio: {value: 0.075,  unit: "-",     source: literature,   doc: fan/id_fan.md}   # tongue nose radius / D2, 5-10 % (ICME 2003)
  mrf_gap_fraction:    {value: 0.5,    unit: "-",     source: model,        doc: fan/id_fan.md}   # MRF zone's rim: r2 + this x the tongue gap
  outlet_stub_ratio:   {value: 1.0,    unit: "-",     source: model,        doc: fan/id_fan.md}   # straight discharge length / its height
  volute_outlet_velocity: {value: 30.0, unit: m/s,    source: model,        doc: fan/id_fan.md}   # sets the spiral's growth: outlet area = Q / this (a decelerating casing, not a free vortex)
  discharge_angle:     {value: 45.0,   unit: deg,     source: model,        doc: fan/id_fan.md}   # discharge up from the horizontal, top angular (the user's reference photo)
  cone_inlet_ratio:    {value: 1.30,   unit: "-",     source: model,        doc: fan/id_fan.md}   # inlet cone's mouth / D1
  side_plate_gap:      {value: 0.05,   unit: m,       source: model,        doc: fan/id_fan.md}   # the volute's front plate between its fluid (y = B) and the inlet box's floor; the cone runs from the eye through it
  inlet_box_area_ratio: {value: 1.75,  unit: "-",     source: model,        doc: fan/id_fan.md}   # box inlet face / eye area (AMCA 201 not read)
  inlet_box_height_ratio: {value: 1.10, unit: "-",    source: model,        doc: fan/id_fan.md}   # box height / the cone's mouth
  inlet_box_reach_ratio: {value: 0.50, unit: "-",     source: model,        doc: fan/id_fan.md}   # box inlet face beyond the cone's rim / the cone's mouth

# ---------------------------------------------------------------------
# Kiln burner: a JETFLEX multi-channel burner (user decision, 16 Nov
# 2026). No plant dimension is published; the duty is the twin's kiln
# firing, the momentum is FLSmidth's JETFLEX range (kiln/kiln_burner.md).
# ---------------------------------------------------------------------
kiln_burner:
  fuel_flow:           {value: 2.09494, unit: kg/s,  source: model,       doc: kiln/kiln_burner.md}
  fuel_LHV:            {value: 32.0,    unit: MJ/kg, source: model,       doc: kiln/kiln_burner.md}
  kiln_air_flow:       {value: 26.3993, unit: kg/s,  source: model,       doc: kiln/kiln_burner.md}
  primary_air_fraction: {value: 0.10,   unit: "-",   source: model,       doc: kiln/kiln_burner.md}
  primary_air_T:       {value: 293.15,  unit: K,     source: model,       doc: kiln/kiln_burner.md}
  # The fuel's fineness for the flame CFD (the twin burns petcoke only:
  # physics.fuel_heat_release). Rosin-Rammler fit of an industrial kiln's
  # petcoke, measured: Alcaide-Moreno, Castan-Lascorz & Tavares, ECOS 2023
  # (doi 10.52202/069564-0041) Table 5: mean 34.193 um, n 0.944, 0.724-138.038 um.
  fuel_rr_mean:        {value: 34.193e-6, unit: m,   source: literature,  doc: kiln/kiln_flame.md}
  fuel_rr_n:           {value: 0.944,   unit: "-",   source: literature,  doc: kiln/kiln_flame.md}
  fuel_d_min:          {value: 0.724e-6, unit: m,    source: literature,  doc: kiln/kiln_flame.md}
  fuel_d_max:          {value: 138.038e-6, unit: m,  source: literature,  doc: kiln/kiln_flame.md}
  # FLSmidth's JETFLEX flame momentum range, primary air (flsmidth.com
  # JETFLEX page): the derived momentum must sit in it (22 Nov 2026: the
  # momentum follows from the channel pressures, no longer an input).
  momentum_min_per_MW: {value: 7.0,     unit: N/MW,  source: literature,  doc: kiln/kiln_burner.md}
  momentum_max_per_MW: {value: 11.0,    unit: N/MW,  source: literature,  doc: kiln/kiln_burner.md}
  # The burner's flow geometry (user, 22 Nov 2026: CFD level; JETFLEX 2.0
  # with fixed nozzles; the twin's primary air = axial + swirl air, the
  # coal's conveying air on top). FLS publishes no size.
  # Channel pressures over the hood: JETFLEX 2.0 manual, axial air
  # 220-350 mbar, swirl air channel about 150-180 mbar (the middles);
  # Pedersen et al. 2017 (Energy Fuels 31, Table 2) measured 210 / 150
  # mbar on a 65 MW JETFLEX.
  axial_pressure:      {value: 28500,   unit: Pa,    source: literature,  doc: kiln/kiln_burner.md}
  swirl_pressure:      {value: 16500,   unit: Pa,    source: literature,  doc: kiln/kiln_burner.md}
  # Coal over its conveying air, kg/kg: Pedersen 2017 Plant 2, 70 MW of
  # 75 % coal (25.2 MJ/kg) + 25 % petcoke (30.7 MJ/kg) = 2.65 kg/s with
  # 4400 m3/h (normal: 1.58 kg/s) of transport air.
  transport_loading:   {value: 1.67,    unit: "-",   source: literature,  doc: kiln/kiln_burner.md}
  # A check, not an input: the coal velocity of a five-channel kiln burner
  # (Appl. Sci. 2026, 16, 2029: 33 m/s); the derived pipe must be near it.
  coal_velocity_ref:   {value: 33.0,    unit: m/s,   source: literature,  doc: kiln/kiln_burner.md}
  # The tip, Fuller JETFLEX 2.0 brochure p. 5 (fixed nozzles), measured at
  # 300 dpi against the tip's outer D (the castable ring's): 20 slots
  # 18.0 deg apart, 40 holes 9.0 deg apart; the slot's long side 103 deg
  # off the radius (13 deg off the tangent); the solid fuel pipe's centre
  # above the tip's. Areas from the pixel count, the slot's aspect from
  # its second moments.
  n_axial:             {value: 20,      unit: "-",   source: derived_from_reference, doc: kiln/kiln_burner.md}
  axial_slot_area_over_D2: {value: 0.000947, unit: "-", source: derived_from_reference, doc: kiln/kiln_burner.md}
  axial_slot_aspect:   {value: 3.17,    unit: "-",   source: derived_from_reference, doc: kiln/kiln_burner.md}
  axial_slot_tilt:     {value: 13.0,    unit: deg,   source: derived_from_reference, doc: kiln/kiln_burner.md}
  axial_ring_r_over_D: {value: 0.3438,  unit: "-",   source: derived_from_reference, doc: kiln/kiln_burner.md}
  n_swirl:             {value: 40,      unit: "-",   source: derived_from_reference, doc: kiln/kiln_burner.md}
  swirl_hole_area_over_D2: {value: 0.000259, unit: "-", source: derived_from_reference, doc: kiln/kiln_burner.md}   # its opening in the tip plane
  swirl_ring_r_over_D: {value: 0.2898,  unit: "-",   source: derived_from_reference, doc: kiln/kiln_burner.md}
  coal_pipe_D_over_D:  {value: 0.3335,  unit: "-",   source: derived_from_reference, doc: kiln/kiln_burner.md}
  coal_pipe_offset_over_D: {value: 0.0536, unit: "-", source: derived_from_reference, doc: kiln/kiln_burner.md}
  # No source (model): the swirl holes' angle off the axis (swirl burners'
  # usual 30-45 deg, the low end; the holes' tip openings, 1.2 times as
  # long round the ring as across, fit about 33 deg), the front plate the
  # openings run through (about 5.5 slot widths: the jets leave along
  # the openings; thicker, the inclined holes' feet run into the axial
  # plenum), the plenums behind it (the solid's inlets: several plenum
  # widths), the coal pipe's length (a developed profile), the plenums'
  # clearance round their openings and the least wall between channels.
  swirl_angle:         {value: 30.0,    unit: deg,   source: model,       doc: kiln/kiln_burner.md}
  plate_t:             {value: 0.06,    unit: m,     source: model,       doc: kiln/kiln_burner.md}
  plenum_L:            {value: 0.50,    unit: m,     source: model,       doc: kiln/kiln_burner.md}
  coal_pipe_L_over_D:  {value: 5.0,     unit: "-",   source: model,       doc: kiln/kiln_burner.md}
  plenum_clearance:    {value: 0.004,   unit: m,     source: model,       doc: kiln/kiln_burner.md}
  wall_min:            {value: 0.003,   unit: m,     source: model,       doc: kiln/kiln_burner.md}
  # The whole burner as simple envelopes (user, 22 Nov 2026: a solid and a
  # sheet of all of it, not a CFD input; kiln_burner_body.bas). Fuller
  # JETFLEX 2.0 brochure p. 3, the side view (orthographic), measured on a
  # 200 dpi render against the tip's outer D (79 px, +-2 px = +-0.03 D):
  # lengths along the axis from the tip back; diameters. The brochure's
  # burner is of no stated capacity: the ratios are carried to this one.
  body_tip_ring_L:     {value: 1.11,    unit: "-",   source: derived_from_reference, doc: kiln/kiln_burner.md}   # castable tip ring (the tip's D)
  body_castable_L:     {value: 10.42,   unit: "-",   source: derived_from_reference, doc: kiln/kiln_burner.md}   # castable to its back end
  body_castable_D:     {value: 0.97,    unit: "-",   source: derived_from_reference, doc: kiln/kiln_burner.md}   # behind the tip ring
  body_collar_L:       {value: 0.24,    unit: "-",   source: derived_from_reference, doc: kiln/kiln_burner.md}   # bare steel pipe behind it
  body_flange_L:       {value: 0.10,    unit: "-",   source: derived_from_reference, doc: kiln/kiln_burner.md}
  body_flange_D:       {value: 1.11,    unit: "-",   source: derived_from_reference, doc: kiln/kiln_burner.md}
  body_head_L:         {value: 2.00,    unit: "-",   source: derived_from_reference, doc: kiln/kiln_burner.md}   # the air connection head
  body_head_D:         {value: 0.89,    unit: "-",   source: derived_from_reference, doc: kiln/kiln_burner.md}
  body_bellows_L:      {value: 0.28,    unit: "-",   source: derived_from_reference, doc: kiln/kiln_burner.md}   # expansion joint
  body_bellows_D:      {value: 0.95,    unit: "-",   source: derived_from_reference, doc: kiln/kiln_burner.md}
  body_coal_L:         {value: 2.19,    unit: "-",   source: derived_from_reference, doc: kiln/kiln_burner.md}   # solid fuel inlet pipe, to its flange's back face centre
  body_coal_D:         {value: 0.37,    unit: "-",   source: derived_from_reference, doc: kiln/kiln_burner.md}
  body_coal_flange_D:  {value: 0.50,    unit: "-",   source: derived_from_reference, doc: kiln/kiln_burner.md}
  # the coal inlet's slight bend up near its flange (the alternative-fuel
  # close-ups the user gave, 23 Nov 2026: the tilted piece 7-12 deg over
  # its edges in one, ~16 deg in the side view): its tilt, where the bend
  # starts in front of the flange's back face (side view, 1 D = 124 px)
  body_coal_tilt_deg:  {value: 12.0,    unit: deg,   source: derived_from_reference, doc: kiln/kiln_burner.md}
  body_coal_kink_at:   {value: 1.0,     unit: "-",   source: derived_from_reference, doc: kiln/kiln_burner.md}
  # The tip's other tubes (brochure p. 5, the fixed nozzle tip seen from
  # the kiln; 1 D = 777 px): the fuel lance's OD and its axis under the
  # burner's (C), the flame scanner's and the igniter's OD and axis, either
  # side (B at -x, E at +x).
  body_lance_D:        {value: 0.088,   unit: "-",   source: derived_from_reference, doc: kiln/kiln_burner.md}
  body_lance_y:        {value: -0.188,  unit: "-",   source: derived_from_reference, doc: kiln/kiln_burner.md}
  body_scanner_D:      {value: 0.039,   unit: "-",   source: derived_from_reference, doc: kiln/kiln_burner.md}
  body_scanner_x:      {value: 0.092,   unit: "-",   source: derived_from_reference, doc: kiln/kiln_burner.md}
  body_scanner_y:      {value: -0.152,  unit: "-",   source: derived_from_reference, doc: kiln/kiln_burner.md}
  # how far they run on behind the expansion joint's back wall (p. 3 side
  # view: the injection pipe with its fittings out of the joint's back;
  # 1 D = 100 px from the head's 2.0 D; p. 4: the joint guides them)
  body_lance_tail:     {value: 0.8,     unit: "-",   source: derived_from_reference, doc: kiln/kiln_burner.md}
  # Air inlet 1, the elbow (the brochure's alternative-fuel side view and
  # the cover close-up the user gave, 23 Nov 2026; scale: the head's D =
  # 0.89 D): a neck straight out of the head's -x side at right angles to
  # it, one smooth 90 deg long radius bend up (R = 1.5 x the pipe's OD,
  # ASME B16.9 LR: the air passes easily), its flange straight on the
  # bend's end, facing up (user: at right angles, one bend, exactly as the
  # close-up). Its OD; along the axis from the head's front face where it
  # leaves; its neck's height over the axis (level with it); its neck's
  # length off the head's surface to the bend (read by eye, the close-up).
  # Inlet 2 a flanged stub on the same side further back. Which is axial,
  # which swirl air: not shown.
  body_inlet1_D:       {value: 0.38,    unit: "-",   source: derived_from_reference, doc: kiln/kiln_burner.md}
  body_elbow_up_at:    {value: 1.13,    unit: "-",   source: derived_from_reference, doc: kiln/kiln_burner.md}
  body_elbow_y:        {value: 0.0,     unit: "-",   source: derived_from_reference, doc: kiln/kiln_burner.md}
  body_elbow_neck_L:   {value: 0.30,    unit: "-",   source: schematic,   doc: kiln/kiln_burner.md}
  body_inlet2_at:      {value: 1.72,    unit: "-",   source: derived_from_reference, doc: kiln/kiln_burner.md}
  body_inlet2_D:       {value: 0.36,    unit: "-",   source: derived_from_reference, doc: kiln/kiln_burner.md}
  # the carriage beam over the head: its underside over the axis, its
  # height; the rear hanger down to the head (from the head's front face)
  body_beam_y:         {value: 1.04,    unit: "-",   source: derived_from_reference, doc: kiln/kiln_burner.md}
  body_beam_H:         {value: 0.47,    unit: "-",   source: derived_from_reference, doc: kiln/kiln_burner.md}
  body_hanger2_at:     {value: 1.47,    unit: "-",   source: derived_from_reference, doc: kiln/kiln_burner.md}
  body_hanger2_L:      {value: 0.66,    unit: "-",   source: derived_from_reference, doc: kiln/kiln_burner.md}
  # Not in the side view (schematic): the beam runs out of the picture,
  # its width and the hangers' across, inlet 2's reach off the head's side.
  # From the cover's close-up (perspective, read by eye: schematic): the
  # beam as two channels back to back (plate thickness, the gap between
  # the webs), a diagonal plate joining each one's flanges across its
  # open side, an end plate and two pins at
  # its front; the front support plate in front of the castable's flange
  # (a ring round the pipe, a neck up to the beam, down to a foot plate
  # under the pipe); the head's two bolting flanges; the coal pipe's
  # cooling air nozzle (at right angles to it, out to -x as the air
  # elbow's neck, tilted up; user, 23 Nov 2026).
  # No source (model): the steel burner pipe's wall (inside the castable,
  # its bore the axial plenum's outer D).
  body_beam_L:         {value: 6.0,     unit: "-",   source: schematic,   doc: kiln/kiln_burner.md}
  body_beam_W:         {value: 0.40,    unit: "-",   source: schematic,   doc: kiln/kiln_burner.md}
  body_beam_tail_L:    {value: 0.5,     unit: "-",   source: schematic,   doc: kiln/kiln_burner.md}   # the plates over the channels' open sides at the beam's back end, long
  body_inlet_reach:    {value: 0.30,    unit: "-",   source: schematic,   doc: kiln/kiln_burner.md}
  body_plate_t:        {value: 0.04,    unit: "-",   source: schematic,   doc: kiln/kiln_burner.md}
  body_web_gap:        {value: 0.04,    unit: "-",   source: schematic,   doc: kiln/kiln_burner.md}
  # the beam's diagonal plates: lean, width (across the lean), middle back
  # from the beam's front end (the brochure side close-up the user gave,
  # 23 Nov 2026; scale 1 D = 215 px from the head's L and the beam's H)
  body_brace_deg:      {value: 36.0,    unit: deg,   source: derived_from_reference,   doc: kiln/kiln_burner.md}
  body_brace_W:        {value: 0.30,    unit: "-",   source: derived_from_reference,   doc: kiln/kiln_burner.md}   # the diagonal plate's width
  body_brace_at:       {value: 1.5,     unit: "-",   source: derived_from_reference,   doc: kiln/kiln_burner.md}   # its middle, back from the beam's front end
  body_pin_D:          {value: 0.12,    unit: "-",   source: schematic,   doc: kiln/kiln_burner.md}
  body_pin_L:          {value: 0.12,    unit: "-",   source: schematic,   doc: kiln/kiln_burner.md}
  body_support_D:      {value: 1.20,    unit: "-",   source: schematic,   doc: kiln/kiln_burner.md}
  body_support_W:      {value: 0.50,    unit: "-",   source: schematic,   doc: kiln/kiln_burner.md}
  body_foot_y:         {value: 0.75,    unit: "-",   source: schematic,   doc: kiln/kiln_burner.md}
  body_foot_W:         {value: 0.70,    unit: "-",   source: schematic,   doc: kiln/kiln_burner.md}
  body_foot_L:         {value: 0.40,    unit: "-",   source: schematic,   doc: kiln/kiln_burner.md}
  body_head_flange_D:  {value: 1.00,    unit: "-",   source: schematic,   doc: kiln/kiln_burner.md}
  body_bend_R_over_OD: {value: 1.5,     unit: "-",   source: literature,  doc: kiln/kiln_burner.md}   # ASME B16.9 long radius elbow
  body_nozzle_D:       {value: 0.10,    unit: "-",   source: schematic,   doc: kiln/kiln_burner.md}
  body_nozzle_L:       {value: 0.35,    unit: "-",   source: schematic,   doc: kiln/kiln_burner.md}
  body_nozzle_at:      {value: 0.18,    unit: "-",   source: schematic,   doc: kiln/kiln_burner.md}   # its axis in front of the coal flange
  body_nozzle_deg:     {value: 30.0,    unit: deg,   source: schematic,   doc: kiln/kiln_burner.md}   # its tilt up from level (out to -x)
  body_pipe_t:         {value: 0.010,   unit: m,     source: model,       doc: kiln/kiln_burner.md}
  # The head's partition between its two compartments (front: air inlet 1,
  # the axial air; back: air inlet 2, the swirl air -- a model assumption,
  # the brochure shows neither), back from the head's front face: between
  # the elbow's neck (0.94-1.32 D) and inlet 2 (1.49-1.95 D).
  body_partition_at:   {value: 1.40,    unit: "-",   source: model,       doc: kiln/kiln_burner.md}

# ---------------------------------------------------------------------
# Kiln hood and kiln inlet chamber (user decision, 16 Nov 2026: size by
# the literature's gas velocities; the layout square round the kiln
# passes both checks, so it stays and is a model value, not a schematic).
# ---------------------------------------------------------------------
kiln_hood:
  # The kiln's air (kiln_burner.kiln_air_flow) splits as the twin splits
  # it (main._update_steady_state_mass_flow): primary air (axial + swirl,
  # kiln_burner.primary_air_fraction), air leaking in cold through the
  # outlet seal, and the cooler's secondary air, the rest (23 Nov 2026:
  # the flat 26.246 kg/s of 14 Nov predated the seal leak). The leak's
  # share: the VDZ BAT reference kiln, CEMCAP D3.2 rev 2 (zenodo 1257112)
  # Tables 3.8/3.9, as configs/twin_cfg.yaml burning.kiln_seal_air_fraction.
  seal_air_fraction:   {value: 0.20,   unit: "-",    source: literature,  doc: kiln/kiln_hood.md}
  # The secondary air off the cooler's first segment (the twin's, ~1255 K
  # on 23 Nov 2026; the twin is not final): model.
  secondary_air_T:     {value: 1250.0, unit: K,      source: model,       doc: kiln/kiln_hood.md}
  air_velocity_min:    {value: 4.0,    unit: m/s,    source: literature,  doc: kiln/kiln_hood.md}
  air_velocity_max:    {value: 10.0,   unit: m/s,    source: literature,  doc: kiln/kiln_hood.md}
  # The hood as a box (user decision, 23 Nov 2026: size it from the
  # kiln's outlet seal): its back wall round the seal, the seal's outer
  # radius plus this clearance either side and over it (below the kiln
  # the cooler's back wall closes it); its depth the cooler's hood
  # opening. No source for the clearance: model (the velocity band's
  # lower end, 4 m/s, allows at most ~0.33 m).
  seal_clearance:      {value: 0.25,   unit: m,      source: model,       doc: kiln/kiln_hood.md}
  # The burner in the kiln mouth (literature, 23 Nov 2026):
  # - tip inside the hot kiln, grate cooler: FLSmidth JETFLEX installation
  #   manual (IOM, quoted in search results; ~0.25 m in, adjustable
  #   +-0.75 m; the full text not read); cemnet practice 0-1 m; "in the
  #   plane of the kiln nose (hot) or slightly inside" for grate coolers.
  # - on the kiln axis, parallel to it: "high momentum burners should be
  #   placed parallel to kiln axis ... basic position on the kiln axis"
  #   (cemnet forum consensus); tilting into the load gives reducing
  #   conditions (kiln burning notes). Offsets and tilt 0.
  burner_insertion:    {value: 0.25,   unit: m,      source: literature,  doc: kiln/kiln_burner.md}
  burner_offset_x:     {value: 0.0,    unit: m,      source: literature,  doc: kiln/kiln_burner.md}
  burner_offset_y:     {value: 0.0,    unit: m,      source: literature,  doc: kiln/kiln_burner.md}
  burner_tilt_deg:     {value: 0.0,    unit: deg,    source: literature,  doc: kiln/kiln_burner.md}
  # The flame zone's CFD volume: short stubs carry its inlet/outlet faces
  # off the hood (the cooler's two hood segments under it, segment 2's
  # twice as deep so the two faces stay apart; the tertiary air duct's
  # mouth on the roof). No source: model.
  flame_stub_L:        {value: 0.25,   unit: m,      source: model,       doc: kiln/kiln_hood.md}
  # The tertiary air outlet: the duct's first run straight up off the
  # roof, this many duct diameters, so the hood's recirculation does not
  # reach the outlet face (backflow there; user, 23 Nov 2026: 3 D). The
  # duct's real path to the calciner is not in this volume. Model.
  tertiary_outlet_L_over_D: {value: 3.0, unit: "-",  source: model,       doc: kiln/kiln_hood.md}
  # The flame's length, to check the flame volume holds it (CLAUDE.md
  # rule 8). One published case near this plant: Sarkar & Bhad, CFD of a
  # cement kiln with a multi-channel coal burner (7th Int. Conf. on CFD
  # in the Minerals and Process Industries, CSIRO, Melbourne 2009; Fluent):
  # 68 m x 4.55 m ID kiln, 4500 t/d, the flame zone up to 12 m from the
  # burner (from the abstract as quoted in search results, 23 Nov 2026;
  # the full text was not reachable). Scaled to this kiln by its D
  # (enclosed jet flames: Thring & Newby 1953, Craya-Curtet similarity at
  # a like momentum ratio): an estimate, not a prediction.
  flame_L_ref:         {value: 12.0,   unit: m,      source: literature,  doc: kiln/kiln_burner.md}
  flame_L_ref_D:       {value: 4.55,   unit: m,      source: literature,  doc: kiln/kiln_burner.md}
  # The volume must run at least this many flame lengths from the tip
  # (the burnout and the post-flame mixing inside it; model).
  flame_domain_margin: {value: 2.0,    unit: "-",    source: model,       doc: kiln/kiln_burner.md}
kiln_inlet_chamber:
  gas_velocity_max:    {value: 10.0,   unit: m/s,    source: literature,  doc: kiln/kiln_inlet_chamber.md}
  # The CFD solid's kiln mouth (user decision, 22 Nov 2026): a short
  # stub of the kiln tube, mouth_stub_over_D kiln diameters along its
  # axis, the kiln gas inlet its end disc. The chamber's foot and roof
  # are the tube's bottom and top lines, so a circle split on the wall
  # would touch both (the 0.2 m mouth_clearance that avoided it is gone
  # with the 21 Nov section). No source: model.
  mouth_stub_over_D:   {value: 0.5,    unit: "-",    source: model,       doc: kiln/kiln_inlet_chamber.md}
  gas_velocity_ref_holcim: {value: 23.0, unit: m/s,  source: literature,  doc: kiln/kiln_inlet_chamber.md}   # Holcim StDC 2022, one company's standard: reported, not the check
  # User sketch, 21 Nov 2026 (topology drawing): no roof ledges; the
  # throat's walls run down, the right one to the kiln's roof line, the
  # left one to the ramp's top; the ramp falls at ramp_deg (over meal's
  # 40-45 deg angle of repose) to a short foot at the kiln mouth's lower
  # lip. The foot and the right wall's run to the mouth follow the kiln's
  # slope (kiln.slope: the shell's lines carried in, the foot falling
  # towards the kiln). plant_topology_2d draws it; the CFD solid not yet.
  ramp_deg:            {value: 50.0,   unit: deg,    source: model,       doc: kiln/kiln_inlet_chamber.md}
  ramp_foot:           {value: 1.5,    unit: m,      source: model,       doc: kiln/kiln_inlet_chamber.md}   # foot, ramp toe to the kiln mouth (horizontal run; falls at kiln.slope)

# ---------------------------------------------------------------------
# Meal pipes C1-C5 (user decision, 16 Nov 2026: scale the one literature
# pipe, the calciner's feed pipe, by equal mass flux). The flows are the
# twin's (feed 89.7 kg/s over 2 strings; C5's meal to the kiln 60.41 kg/s).
# ---------------------------------------------------------------------
meal_pipe:
  feed_per_string:     {value: 44.85,   unit: kg/s,  source: model,       doc: preheater/meal_pipe_C4.md}
  c5_meal_per_string:  {value: 30.3084, unit: kg/s,  source: model,       doc: preheater/meal_pipe_C5.md}

# ---------------------------------------------------------------------
# Layout: where the equipment stands. No source gives any of it; it
# only lays the plant out (geometry/plant_topology.md). Elevations of
# the cyclones then follow from their CFD domains (each roof flush with
# the top of the outlet bend below it).
# ---------------------------------------------------------------------
layout:
  kiln_axis_z:         {value: 10.0, unit: m,     source: schematic,    doc: plant_topology.md}
  chamber_margin:      {value: 1.0,  unit: m,     source: model,        doc: kiln/kiln_inlet_chamber.md}
  c5_over_tertiary_air: {value: 1.75, unit: m,    source: schematic,    doc: plant_topology.md}
  gooseneck_to_c5_gap: {value: 1.0,  unit: m,     source: schematic,    doc: plant_topology.md}
  # C1's dust outlets over the top of C2's outlet pipe. Since R1 rises
  # straight on C2's axis (17 Nov 2026) the twin stand over C2, and both
  # C1 meal pipes run back to R2's upright at the inner column (60 deg,
  # the near one joining at 50 deg; plant_topology_2d.bas checks). 9.5
  # with the 15 m columns (17 Nov 2026); back to 4.0 since the risers
  # rise beside the cyclone above and the columns are 5.8 m apart.
  stage_gap:           {value: 4.0,  unit: m,     source: schematic,    doc: plant_topology.md}
  # C2-C4 over the cyclone below: each dust outlet this far over the
  # roof (and riser top) under it -- the cyclone two below shares its
  # column (user decision, 17 Nov 2026). The columns' offset follows
  # from the risers (plant_geometry.riser_inlet); it was a free 15 m.
  dust_over_roof:      {value: 0.5,  unit: m,     source: schematic,    doc: plant_topology.md}
  # the twin C1 (mirror pair, inlet ducts facing each other, R1 on the
  # mirror plane in front): clear gap between the two branches' walls,
  # two lined walls (~0.3 m each) and access; the spacing and R1's Y
  # follow from it (plant_geometry.c1_twin). No source gives either.
  c1_twin_gap:         {value: 1.0,  unit: m,     source: model,        doc: preheater/riser_R1.md}
  r1_up_min:           {value: 0.5,  unit: m,     source: schematic,    doc: plant_topology.md}
  # R1 is C2's outlet pipe straight up on C2's axis (user decisions,
  # 17 Nov 2026 and 21 Nov 2026: R1's bore = C2's D_x, so the conical
  # reducer D_x 4.63 -> 3.07 at 45 deg it had is gone).
  cooler_drop:         {value: 1.0,  unit: m,     source: schematic,    doc: plant_topology.md}
