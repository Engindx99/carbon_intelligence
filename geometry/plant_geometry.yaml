# THE plant's geometry: every PRIMARY dimension, written here once.
#
# Single-source rule (user decision, 13-14 Oct 2026): a dimension is
# written in this file and nowhere else. Volumes, areas, heights,
# elevations and ratios times diameters are DERIVED, in
# geometry/plant_geometry.py, and never written here. The twin
# (main.load_cfg), the SolidWorks macros (generated Const blocks) and
# the equipment docs (generated table blocks) all read from there;
# tools/gen_geometry.py writes the copies and checks them.
#
# Every entry: value, unit, source, doc.
#   source  published              a vendor or catalogue figure (HFC2500, PF5000)
#           derived_from_reference a published figure x an FLS reference ratio
#           literature             a literature value (named in doc)
#           cfd_decision           a user decision for the CFD, departing from the catalogue
#           model                  a modelling parameter, not a plant dimension (a CFD face, a split)
#           schematic              no source; it only lays the plant out
#   doc     the equipment document (under geometry/) that gives the reason
#
# SI units. The plant is two identical 2500 t/d strings, 5000 t/d in all
# (user decision, 12 Oct 2026); per-string equipment is given once.

plant:
  strings: {value: 2, unit: "-", source: cfd_decision, doc: catalog.md}

# ---------------------------------------------------------------------
# Cyclones. C1 and C4 are the two CFD domains (geometry/macros/cyclone.bas
# builds them from these). C2 = C3 = C4. C5 = C4 x scale, nothing of its
# own. Heights are from the dust outlet; the outlet pipe's lengths are
# ratios of the vortex finder diameter.
# ---------------------------------------------------------------------
cyclones:
  C1:
    per_string:        {value: 2,    unit: "-",   source: published,    doc: preheater/cyclone_C1.md}
    D_barrel:          {value: 4.32, unit: m,     source: published,    doc: preheater/cyclone_C1.md}
    H_barrel:          {value: 6.79, unit: m,     source: derived_from_reference, doc: preheater/cyclone_C1.md}
    H_cone:            {value: 4.65, unit: m,     source: derived_from_reference, doc: preheater/cyclone_C1.md}
    # Inlet re-sized for the plant's flow (user decision, 16 Nov 2026):
    # a volute, a = 3.00 m (17.9 m/s at 28.76 kg/s per C1) and S/a 1.15,
    # as C4. The FLS ratios gave S 2.16 and a 4.97 (cyclone_C1.md).
    L_vortex:          {value: 3.45, unit: m,     source: cfd_decision, doc: preheater/cyclone_C1.md}
    D_vortex:          {value: 2.4,  unit: m,     source: derived_from_reference, doc: preheater/cyclone_C1.md}
    D_dust:            {value: 0.4,  unit: m,     source: derived_from_reference, doc: preheater/cyclone_C1.md}
    W_inlet:           {value: 0.86, unit: m,     source: derived_from_reference, doc: preheater/cyclone_C1.md}
    H_inlet:           {value: 3.0,  unit: m,     source: cfd_decision, doc: preheater/cyclone_C1.md}
    inlet_slope:       {value: 0.0,  unit: deg,   source: cfd_decision, doc: preheater/cyclone_C1.md}
    volute:            {value: true, unit: "-",   source: cfd_decision, doc: preheater/cyclone_C1.md}
    outlet_turn:       {value: 180.0, unit: deg,  source: cfd_decision, doc: preheater/cyclone_C1.md}
    outlet_rise_over_Dx: {value: 1.25, unit: "-", source: model,        doc: preheater/cyclone_C1.md}
    outlet_bend_R_over_Dx: {value: 1.5, unit: "-", source: model,       doc: preheater/cyclone_C1.md}
    outlet_run_over_Dx:  {value: 1.25, unit: "-", source: model,        doc: preheater/cyclone_C1.md}
    boi_radius:        {value: 0.8,  unit: m,     source: model,        doc: preheater/cyclone_C1.md}
  C4:
    per_string:        {value: 1,    unit: "-",   source: published,    doc: preheater/cyclone_C4.md}
    D_barrel:          {value: 6.3,  unit: m,     source: published,    doc: preheater/cyclone_C4.md}
    H_barrel:          {value: 6.3,  unit: m,     source: cfd_decision, doc: preheater/cyclone_C4.md}
    H_cone:            {value: 7.3,  unit: m,     source: derived_from_reference, doc: preheater/cyclone_C4.md}
    L_vortex:          {value: 3.9,  unit: m,     source: cfd_decision, doc: preheater/cyclone_C4.md}
    D_vortex:          {value: 4.63, unit: m,     source: derived_from_reference, doc: preheater/cyclone_C4.md}
    D_dust:            {value: 0.81, unit: m,     source: derived_from_reference, doc: preheater/cyclone_C4.md}
    W_inlet:           {value: 2.912, unit: m,    source: cfd_decision, doc: preheater/cyclone_C4.md}
    H_inlet:           {value: 3.4,  unit: m,     source: cfd_decision, doc: preheater/cyclone_C4.md}
    inlet_slope:       {value: 0.0,  unit: deg,   source: cfd_decision, doc: preheater/cyclone_C4.md}
    volute:            {value: true, unit: "-",   source: cfd_decision, doc: preheater/cyclone_C4.md}
    outlet_turn:       {value: 90.0, unit: deg,   source: cfd_decision, doc: preheater/cyclone_C4.md}
    outlet_rise_over_Dx: {value: 1.7, unit: "-",  source: cfd_decision, doc: preheater/cyclone_C4.md}
    outlet_bend_R_over_Dx: {value: 1.0, unit: "-", source: model,       doc: preheater/cyclone_C4.md}
    outlet_run_over_Dx:  {value: 1.0, unit: "-",  source: model,        doc: preheater/cyclone_C4.md}
    boi_radius:        {value: 1.5,  unit: m,     source: model,        doc: preheater/cyclone_C4.md}
  C2: {same_as: C4, per_string: {value: 1, unit: "-", source: published, doc: preheater/cyclone_C2.md}}
  C3: {same_as: C4, per_string: {value: 1, unit: "-", source: published, doc: preheater/cyclone_C3.md}}
  C5:
    scaled_from: C4
    # its published D 6.50 over C4's 6.30: every length of the C4 domain
    # scales, so C4's Euler number and volute swirl carry over
    D_barrel_published: {value: 6.5, unit: m,     source: published,    doc: preheater/cyclone_C5.md}
    per_string:        {value: 1,    unit: "-",   source: published,    doc: preheater/cyclone_C5.md}
    boi_radius:        {value: 1.55, unit: m,     source: model,        doc: preheater/cyclone_C5.md}

# Parts of the cyclone CFD domains that are not per cyclone
# (geometry/macros/cyclone.bas)
cyclone_domain:
  vortex_wall:         {value: 0.08, unit: m,     source: model,        doc: preheater/cyclone_C1.md}
  inlet_duct_length:   {value: 3.0,  unit: m,     source: model,        doc: preheater/cyclone_C4.md}
  inlet_roof_clearance: {value: 0.05, unit: m,    source: model,        doc: preheater/cyclone_C1.md}
  inlet_tangent_relief: {value: 0.0, unit: m,     source: model,        doc: preheater/cyclone_C1.md}
  volute_tongue:       {value: 0.05, unit: m,     source: model,        doc: preheater/cyclone_C4.md}
  volute_overlap:      {value: 0.1,  unit: m,     source: model,        doc: preheater/cyclone_C4.md}
  # C1's own riser branch: half of R1's area each, R1 below the twin
  c1_riser_area_share: {value: 0.5,  unit: "-",   source: cfd_decision, doc: preheater/riser_R1.md}
  c1_riser_transition: {value: 1.5,  unit: m,     source: model,        doc: preheater/riser_R1.md}
  c1_riser_bend_R_over_D: {value: 1.0, unit: "-", source: model,        doc: preheater/riser_R1.md}
  c1_riser_above_feed: {value: 3.0,  unit: m,     source: model,        doc: preheater/riser_R1.md}
  c1_riser_below_feed: {value: 4.5,  unit: m,     source: model,        doc: preheater/riser_R1.md}
  c1_feed_width:       {value: 0.6,  unit: m,     source: literature,   doc: preheater/riser_R1.md}
  c1_feed_height:      {value: 0.6,  unit: m,     source: literature,   doc: preheater/riser_R1.md}
  c1_feed_depth:       {value: 1.0,  unit: m,     source: model,        doc: preheater/riser_R1.md}
  meal_slope:          {value: 60.0, unit: deg,   source: literature,   doc: calciner/calciner.md}

# ---------------------------------------------------------------------
# Risers: the gas from C(k+1) up to C(k). R2-R4 are C3-C5's CFD outlet
# pipes themselves, rise + bend + leg (user decision, 14 Oct 2026; the
# published Ø3.35-3.60 risers are not this plant's); only R1, from C2's
# outlet up to the twin C1, has a bore of its own. The paths are
# derived: plant_geometry.stage_riser / r1_path.
# ---------------------------------------------------------------------
risers:
  R1: {D: {value: 3.07, unit: m, source: published, doc: preheater/riser_R1.md}}

# ---------------------------------------------------------------------
# Calciner (ILC), PF5000, and its Y gooseneck
# ---------------------------------------------------------------------
calciner:
  D_shell:             {value: 7.2,  unit: m,     source: published,    doc: calciner/calciner.md}
  # the effective bore: the shell x FLS calciner_eff_over_shell 3.08 / 3.29
  # (catalog.md) = 6.740426, set at 0.1 mm as the CFD solid was built
  D:                   {value: 6.7404, unit: m,   source: derived_from_reference, doc: calciner/calciner.md}
  H:                   {value: 30.0, unit: m,     source: published,    doc: calciner/calciner.md}
  cone_angle:          {value: 65.0, unit: deg,   source: literature,   doc: calciner/calciner.md}
  # the throat is sized from a literature kiln-gas flow at a literature velocity
  throat_gas_flow:     {value: 61.44444444, unit: kg/s, source: literature, doc: calciner/calciner.md}
  throat_gas_T:        {value: 1323.15, unit: K,  source: literature,   doc: calciner/calciner.md}
  throat_gas_x_N2:     {value: 0.744, unit: mol/mol, source: literature, doc: calciner/calciner.md}
  throat_gas_x_O2:     {value: 0.076, unit: mol/mol, source: literature, doc: calciner/calciner.md}
  throat_gas_x_H2O:    {value: 0.05,  unit: mol/mol, source: literature, doc: calciner/calciner.md}
  throat_gas_x_CO2:    {value: 0.13,  unit: mol/mol, source: literature, doc: calciner/calciner.md}
  throat_velocity:     {value: 29.0, unit: m/s,   source: literature,   doc: calciner/calciner.md}
  throat_length_over_D: {value: 1.0, unit: "-",   source: model,        doc: calciner/calciner.md}
  D_tertiary_air:      {value: 2.4393, unit: m,   source: derived_from_reference, doc: calciner/calciner.md}
  # the literature flow it carries (Mikulcic 2012 TA + burner air, x 2;
  # 800 C, Kahawalage 2017) at a literature velocity (Chanamai 2019):
  # the duct above within 0.2 mm (it was sized at 54.92 kg/s), and the
  # CFD's tertiary air inlet
  tertiary_air_flow:   {value: 54.925, unit: kg/s, source: literature,  doc: calciner/calciner.md}
  tertiary_air_T:      {value: 1073.15, unit: K,  source: literature,   doc: calciner/calciner.md}
  tertiary_air_x_N2:   {value: 0.79, unit: mol/mol, source: literature, doc: calciner/calciner.md}
  tertiary_air_x_O2:   {value: 0.21, unit: mol/mol, source: literature, doc: calciner/calciner.md}
  tertiary_air_velocity: {value: 35.87, unit: m/s, source: literature,  doc: calciner/calciner.md}
  # The tertiary air duct enters at the bottom of the cylinder,
  # tangentially (Chen et al., a 5000 t/d in-line calciner; user
  # decision, 14 Oct 2026): its lower edge on the top of the cone and
  # its outer wall on the vessel's, each kept a hair clear so no two
  # surfaces of the boolean touch (cyclone.bas's inlet roof clearance,
  # the same reason). A stub of it, past the vessel's tangent plane.
  tertiary_air_cone_clearance: {value: 0.05, unit: m, source: model,   doc: calciner/calciner.md}
  tertiary_air_wall_relief: {value: 0.05, unit: m, source: model,      doc: calciner/calciner.md}
  tertiary_air_stub_length: {value: 3.0, unit: m,  source: model,      doc: calciner/calciner.md}
  # Meal and fuel just above the tertiary air (Chen et al.; the main
  # meal inlet above the tertiary air inlet, US 10,974,992): each pipe's
  # hole in the wall starts this far over the duct's top.
  feed_above_tertiary_air: {value: 1.0, unit: m,  source: model,       doc: calciner/calciner.md}
  D_feed:              {value: 0.8485, unit: m,   source: literature,   doc: calciner/calciner.md}
  feed_depth:          {value: 1.0,  unit: m,     source: model,        doc: calciner/calciner.md}
  # Fuel: Fidaros 2007's two 0.2 m coal pipes at 30 deg, x sqrt 2 for a
  # string each (as the meal pipes); at the meal's height, 90 deg round
  # from them (Chen et al.: coal and meal at one height, in different
  # directions)
  D_fuel:              {value: 0.2828, unit: m,   source: literature,   doc: calciner/calciner.md}
  fuel_slope:          {value: 30.0, unit: deg,   source: literature,   doc: calciner/calciner.md}

gooseneck:
  D_leg:               {value: 3.5,  unit: m,     source: published,    doc: preheater/gooseneck.md}
  # The neck: three straight pieces over the vessel's top (user decision,
  # 15 Nov 2026, replacing the Y straight on the roof): one rising from
  # the roof at neck_slope, one level (0 deg), one dropping at neck_slope,
  # each pipe the next one's mitre. Lengths are model choices (no
  # source), in neck diameters; the roof's middle is the first piece's
  # axis; the neck bends forward (-y), so it comes down in front of the
  # vessel.
  neck_slope:              {value: 45.0, unit: deg, source: model, doc: preheater/gooseneck.md}
  neck_piece_over_D_neck:  {value: 1.0,  unit: "-", source: model, doc: preheater/gooseneck.md}
  neck_level_over_D_neck:  {value: 1.0,  unit: "-", source: model, doc: preheater/gooseneck.md}
  # Below the third piece the neck goes on as one vertical channel of its
  # own diameter, its length in neck diameters (model choice, user
  # decision 15 Nov 2026: one straight channel first, the Y below it).
  channel_over_D_neck:     {value: 1.5,  unit: "-", source: model, doc: preheater/gooseneck.md}
  # The Y: from the channel's lower end each arm leaves in the plane across
  # the channel (x-z), at arm_angle from the vertical (user decision, 15 Nov
  # 2026), runs one straight piece down, and turns (mitre) to a level run
  # (at C5's inlet axis: plant_geometry.gooseneck()).
  arm_angle:               {value: 60.0, unit: deg, source: model, doc: preheater/gooseneck.md}
  # The arm's inclined piece runs down to the level run's axis (C5's
  # inlet axis), so its length follows; the level run then goes on, in leg
  # diameters, to the outlet face (user's sketch, 15 Nov 2026).
  arm_run_over_D_leg:      {value: 2.0,  unit: "-", source: model, doc: preheater/gooseneck.md}

# ---------------------------------------------------------------------
# Rotary kiln, PF5000
# ---------------------------------------------------------------------
kiln:
  D:                   {value: 4.8,  unit: m,     source: published,    doc: kiln/kiln.md}
  L:                   {value: 74.0, unit: m,     source: published,    doc: kiln/kiln.md}
  slope:               {value: 3.0,  unit: "%",   source: published,    doc: kiln/kiln.md}
  # the back end the twin's transition zone solves (25/60 of the tube)
  transition_L:        {value: 30.83, unit: m,    source: model,        doc: kiln/kiln.md}
  # The wall stack, hot face outward (physics/shell.py has the materials).
  # NOTE: the published 4.8 m is the SHELL diameter; the twin uses it as
  # the bore (user decision, 12 Oct 2026), so the stack is added outward.
  # With this stack the real bore would be 4.8 - 2 (0.030 + 0.220) = 4.30 m
  # (open item, 15 Nov 2026).
  # Steel plate: welded kilns 25-35 mm (cementkilns.co.uk, "Design features
  # of rotary kilns"); tyre wrapper plates are local and not modelled.
  shell_t:             {value: 0.030, unit: m,    source: literature,   doc: kiln/kiln.md}
  # Brick ring: 220 mm for kiln diameters 4200-5200 mm (supplier table in
  # R. Mosci, "Lining thickness"); VDZ B222..B622 and ISO 222 shapes are
  # h = 220 mm (rotary kiln brick installation guideline). The basic
  # (burning) and alumina (transition) rings are the same thickness.
  lining_t:            {value: 0.220, unit: m,    source: literature,   doc: kiln/kiln.md}
  # Burning zone coating: the thickness that holds the shell at 190-220 C,
  # the operating band of Sadighi et al. 2011 (Can. J. Chem. Eng.,
  # doi 10.1002/cjce.20365), on this stack with a 1300-1450 C hot
  # face gives 151-252 mm; 0.20 m is the middle (205 C at 1400 C).
  burning_coating_t:   {value: 0.200, unit: m,    source: model,        doc: kiln/kiln.md}
  # Transition coating: no source; coating there is thin and intermittent.
  transition_coating_t: {value: 0.050, unit: m,   source: model,        doc: kiln/kiln.md}

# ---------------------------------------------------------------------
# Grate cooler: PF5000 grate area, FLS reference cooler width and height
# ---------------------------------------------------------------------
cooler:
  grate_area:          {value: 119.6, unit: m2,   source: published,    doc: cooler/cooler.md}
  width:               {value: 4.0,  unit: m,     source: literature,   doc: cooler/cooler.md}
  casing_height:       {value: 3.0,  unit: m,     source: literature,   doc: cooler/cooler.md}
  # FLS reference cooler's 10-segment model: the undergrate air's segments, and how many from the
  # hot end carry the hood's opening (segment 1 -> the kiln, 2 -> the tertiary air; both leave by the hood)
  segments:            {value: 10,   unit: "-",   source: literature,   doc: cooler/cooler.md}
  hood_segments:       {value: 2,    unit: "-",   source: literature,   doc: cooler/cooler.md}

# ---------------------------------------------------------------------
# Preheater ID fan (user decision, 16 Nov 2026: one per string, 8 kPa):
# the duty point is the twin's exhaust as it stood when the CFD solid
# was built (77c15ba, 15 Nov 2026), FROZEN there as a design duty
# (user decision, 15 Nov 2026): the fan's size follows from it by fan
# laws and no longer moves with every twin change. The twin is only
# checked to stay within +-5 K / +-2 % of it (tests/test_plant_geometry.py).
# No plant dimension is published (fan/id_fan.md).
# ---------------------------------------------------------------------
id_fan:
  per_string:          {value: 1,      unit: "-",     source: cfd_decision, doc: fan/id_fan.md}
  exhaust_flow_per_string: {value: 57.526, unit: kg/s, source: cfd_decision, doc: fan/id_fan.md}
  exhaust_T:           {value: 572.19, unit: K,       source: cfd_decision, doc: fan/id_fan.md}
  exhaust_molar_mass:  {value: 31.9,   unit: g/mol,   source: model,        doc: fan/id_fan.md}
  inlet_underpressure: {value: 4000.0, unit: Pa,      source: model,        doc: fan/id_fan.md}
  total_pressure:      {value: 8000.0, unit: Pa,      source: model,        doc: fan/id_fan.md}
  efficiency:          {value: 0.80,   unit: "-",     source: literature,   doc: fan/id_fan.md}
  speed:               {value: 1000.0, unit: rpm,     source: literature,   doc: fan/id_fan.md}
  pressure_coefficient: {value: 1.3,   unit: "-",     source: model,        doc: fan/id_fan.md}   # psi = 2 dp / (rho u2^2); 1.3 gives a wide wheel (b2/D2 0.20) like the user's reference fan photo (15 Nov 2026); no source
  motor_margin:        {value: 1.10,   unit: "-",     source: model,        doc: fan/id_fan.md}
  # The fan's flow path (user decisions, 15 Nov 2026): a fluid volume with
  # a bladed impeller in its own rotating (MRF) zone, an inlet box and cone,
  # a log-spiral volute sized by its outlet velocity and a plain discharge
  # 45 deg up (no evasé). Sources in fan/id_fan.md.
  eye_ratio:           {value: 0.70,   unit: "-",     source: literature,   doc: fan/id_fan.md}   # D1/D2, the top of 0.4-0.7 (IJTE 2022)
  blade_outlet_angle:  {value: 45.0,   unit: deg,     source: literature,   doc: fan/id_fan.md}   # beta2 from the tangent; Reitz's preheater ID fan, Senegal (552 000 m3/h, 980 rpm): 45 deg for dusty gas
  incidence:           {value: 3.0,    unit: deg,     source: model,        doc: fan/id_fan.md}   # blade inlet angle over the flow angle
  blade_number_coeff:  {value: 8.5,    unit: "-",     source: literature,   doc: fan/id_fan.md}   # z = k sin(beta2) / (1 - D1/D2) (IJTE 2022)
  blade_thickness:     {value: 0.012,  unit: m,       source: model,        doc: fan/id_fan.md}   # plate blade, no source
  blade_edge_clearance: {value: 0.001, unit: m,       source: model,        doc: fan/id_fan.md}   # blades stop this short of the eye and tip circles: their caps leave those edges whole (no sliver faces)
  hydraulic_efficiency: {value: 0.88,  unit: "-",     source: model,        doc: fan/id_fan.md}   # dp = eta_h rho u2 cu2
  volute_width_ratio:  {value: 3.0,    unit: "-",     source: literature,   doc: fan/id_fan.md}   # B / b2, the rule's 2-3 (ICME 2003: 2.14)
  tongue_gap_ratio:    {value: 0.075,  unit: "-",     source: literature,   doc: fan/id_fan.md}   # (r3 - r2) / D2, cut-off clearance 6-13 % (Reitz India, CII 2024)
  tongue_radius_ratio: {value: 0.075,  unit: "-",     source: literature,   doc: fan/id_fan.md}   # tongue nose radius / D2, 5-10 % (ICME 2003)
  mrf_gap_fraction:    {value: 0.5,    unit: "-",     source: model,        doc: fan/id_fan.md}   # MRF zone's rim: r2 + this x the tongue gap
  outlet_stub_ratio:   {value: 1.0,    unit: "-",     source: model,        doc: fan/id_fan.md}   # straight discharge length / its height
  volute_outlet_velocity: {value: 30.0, unit: m/s,    source: model,        doc: fan/id_fan.md}   # sets the spiral's growth: outlet area = Q / this (a decelerating casing, not a free vortex)
  discharge_angle:     {value: 45.0,   unit: deg,     source: model,        doc: fan/id_fan.md}   # discharge up from the horizontal, top angular (the user's reference photo)
  cone_inlet_ratio:    {value: 1.30,   unit: "-",     source: model,        doc: fan/id_fan.md}   # inlet cone's mouth / D1
  side_plate_gap:      {value: 0.05,   unit: m,       source: model,        doc: fan/id_fan.md}   # the volute's front plate between its fluid (y = B) and the inlet box's floor; the cone runs from the eye through it
  inlet_box_area_ratio: {value: 1.75,  unit: "-",     source: model,        doc: fan/id_fan.md}   # box inlet face / eye area (AMCA 201 not read)
  inlet_box_height_ratio: {value: 1.10, unit: "-",    source: model,        doc: fan/id_fan.md}   # box height / the cone's mouth
  inlet_box_reach_ratio: {value: 0.50, unit: "-",     source: model,        doc: fan/id_fan.md}   # box inlet face beyond the cone's rim / the cone's mouth

# ---------------------------------------------------------------------
# Kiln burner: a JETFLEX multi-channel burner (user decision, 16 Nov
# 2026). No plant dimension is published; the duty is the twin's kiln
# firing, the momentum is FLSmidth's JETFLEX range (kiln/kiln_burner.md).
# ---------------------------------------------------------------------
kiln_burner:
  fuel_flow:           {value: 2.09494, unit: kg/s,  source: model,       doc: kiln/kiln_burner.md}
  fuel_LHV:            {value: 32.0,    unit: MJ/kg, source: model,       doc: kiln/kiln_burner.md}
  kiln_air_flow:       {value: 26.3993, unit: kg/s,  source: model,       doc: kiln/kiln_burner.md}
