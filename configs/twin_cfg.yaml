plant:
  N: 20
  length: 60.0   # m

transition:
  length: 25.0

calciner:
  length: 25.0

preheater:
  length: 25.0
  nodes_per_stage: 20   # co-current heat-transfer nodes per cyclone stage (numerical)

cooler:
  length: 25.0


simulation:
  dt: 0.05
  total_hours: 3.0
  chunk_hours: 1.0


fuel:
  Fuel_rate_total: 2.5
  O2: 3.5


burning:
  primary_air_fraction: 0.10   # fraction of kiln combustion air carried in with the fuel (ambient T)


cooler_air:
  cooling_air_rate_kg_per_kg_clinker: 2.2   # total cooler (fan) air, kg air / kg clinker
  tertiary_air_fraction: 0.28               # fraction of cooler air routed to precalciner (tertiary air)


motion:
  rpm_default: 1.5
  rpm_min: 1.0
  rpm_max: 3.0
  inclination_deg: 3.0


feed:
  Feed_rate_kg_s: 27.78   # 100000 kg/h clinker feed (SOLID INPUT)
  inventory_kg: 100000


operational:
  kiln_load: 1.0
  availability: 0.95
  bypass_ratio: 0.0
  false_air_ratio: 0.03
  calcination_degree_target: 0.92


logging:
  
  interval_sec: 60      # Temperature & control report interval [s]

checkpoint:
  enabled: true
  file: burning_ckpt.pkl