# Zone lengths [m]. Zones are laid end to end along the solid path
# (physics/axial_coordinate.py): preheater -> calciner -> transition
# -> burning -> cooler, z = 0 at the preheater feed inlet.
plant:
  N: 20

# ======================================================
# THE ROTARY TUBE
#
# One length for the whole rotary kiln, because that is the
# number a kiln actually has. The tube is the transition zone
# plus the burning zone; `transition.length` below splits it and
# the burning zone is whatever is left, so the two cannot drift
# apart. Named `kiln` rather than sitting under `plant`, which
# means the whole pyroprocess -- preheater through cooler.
#
# This used to be `plant.length: 60.0  # burning zone length`,
# consumed by the burning zone ALONE, with transition's 25 m on
# top. That made the tube 85 m at D = 4.2 m, i.e. L/D = 20.2.
#
# L/D is what says whether a kiln is the right kiln. With
# fuel.kiln_fraction = 0.40 this plant burns 60% of its fuel in
# the calciner, so it is an in-line calciner (ILC) plant, and a
# precalciner kiln is SHORT: US4425092 puts it below 14:1 and
# preferably at 7:1-11:1, against 15:1-17:1 for a conventional
# cyclone-preheater kiln with no precalciner. 20.2 was not
# merely long, it was the wrong kiln type -- long-dry/wet
# territory.
#
# 46.2 m is L/D = 11.00, the conservative end of that preferred
# 7:1-11:1 range. MEASURED, and the reason this is where it
# stops rather than a number chosen for the answer it gives:
#
#   tube   L/D    Ts_burning max   secondary air   kiln discharge
#   85.0  20.24      1622.64 K        948.69 K       1295.42 K
#   60.0  14.29      1703.51 K       1020.02 K       1415.94 K
#   46.2  11.00      1771.16 K       1085.57 K       1524.09 K
#   37.8   9.00      1832.07 K       1148.30 K       1625.04 K
#
# At L/D 9 the bed reaches 1832 K and breaks
# BOUNDS["Ts_any_zone_max"] = 1773 K, the clinker liquidus. So
# the LOWER half of the literature's preferred range is
# incompatible with this model's own physical bound, and 11 is
# simultaneously the literature value and the furthest this
# plant can go without violating one. It is a bounded stopping
# point, not a fitted one.
#
# NOT COMFORTABLE, and not to be forgotten: 1771.16 K leaves
# 1.8 K of margin to the liquidus. A model sitting on a limit
# has none left for a disturbance.
#
# THE OTHER LITERATURE CONSTRAINT IS STILL NOT MET. Modern
# precalciner systems run 25-35 min of kiln residence; at
# u_s = 0.01492 m/s this tube gives 51.85 min, and only L/D 7
# (29.4 m) would reach the band -- far past where the liquidus
# breaks. That gap is NOT length. u_s comes from
# bed_motion_from_continuity, so it falls out of rpm, slope,
# diameter and feed: D = 4.2 m is sized for 35-46 kg/s of
# clinker and this plant makes 19.18, leaving the bed thin and
# slow. The diameter is the next question, and it is a
# different one.
kiln:
  length: 46.2   # m, transition + burning; L/D = 11.0

transition:
  length: 25.0   # m, the kiln's back end; burning gets the rest

calciner:
  length: 25.0   # m

preheater:
  length: 25.0   # m, equivalent solid path length (stage volume sizing)
  nodes_per_stage: 20   # co-current heat-transfer nodes per cyclone stage (numerical)

cooler:
  length: 25.0   # m

  # Clinker nodule diameter, for the packed-bed specific surface
  # 6(1-eps)/d_p that sets the gas->solid contact area the cooling
  # air sees. The cooler used to pass its 4.2 m VESSEL diameter
  # into that d_p -- the same substitution
  # pyroprocess/burning/heat_transfer.py:133-138 documents and
  # fixed for the kiln.
  #
  # Clinker leaves a kiln nodulised at roughly 10-25 mm, and a
  # grate passes up to ~25 mm before the crusher. 15 mm is the
  # middle of that. The real distribution is wide (dust below
  # 0.5 mm can be 1-70%), so this is a stand-in for a whole PSD.
  #
  # IT DOES NOT MATTER MUCH, AND THAT IS THE POINT. MEASURED on
  # the converged plant by scaling a_gs directly:
  #
  #   a_gs x     NTU    secondary air   clinker discharge
  #      1      1.20       717.81 K         462.06 K
  #     10     12.29       912.55 K         363.94 K
  #     25     30.79       934.47 K         356.89 K
  #    100    123.34       946.13 K         353.41 K
  #
  # Ten-fold in area moves secondary air 33.6 K. 15 mm is a 280x
  # correction, far onto that plateau, and so is every other
  # defensible nodule size -- 5 mm and 25 mm land within a few K
  # of each other. This is a mechanism being corrected, not a
  # parameter being fitted, and the plateau is what makes that
  # checkable rather than assertable (see
  # tests/test_cooler_contact_area.py).
  particle_diameter_m: 0.015


simulation:
  dt: 0.05
  total_hours: 3.0
  chunk_hours: 1.0

  # Picard sweep budget for the steady-state solve (main.Twin.run).
  # It is a BUDGET, not an answer -- the loop exits on the same
  # tolerance whatever this is set to.
  #
  # Measured 2026-09-19: 71 sweeps at nodes_per_stage=1, 67 at 20,
  # so 100 carried ~40% margin.
  #
  # Measured 2026-09-20, shortening the rotary tube: 101 sweeps at
  # 60 m, 94 at the committed 46.2 m. The 60 m case missed the old
  # budget of 100 by ONE sweep, with thermal 5.771e-07 K, mass
  # 1.421e-14 kg/s and solid_handoff 4.521e-04 W -- every
  # criterion met, nothing diverging.
  #
  # That is the same near-miss the preheater inner loop had at 51
  # against a budget of 50 (pyroprocess/preheater/heat_transfer.py)
  # and it is worth saying twice: a run that hits the cap is
  # reporting budget exhaustion, which looks identical to a
  # divergence from outside and is not one. Check the residual
  # trajectory before raising this OR before calling it a failure.
  #
  # 150 is ~60% margin over the measured 94.
  max_iterations: 150


fuel:
  Fuel_rate_total: 2.5
  O2: 3.5              # dry STACK O2 [%], sizing the plant's total combustion air

  # Share of the total fuel burned at the kiln burner; the rest fires
  # in the precalciner. In-line calciner (ILC) plants run 35-45% at the
  # kiln, so 0.40 is the mid-range literature value for the generic
  # reference kiln this config describes. Firing 100% at the kiln (the
  # previous behaviour) puts 3892 kJ/kg clinker into the kiln alone,
  # more than a whole plant's specific heat consumption.
  kiln_fraction: 0.40


burning:
  primary_air_fraction: 0.10   # fraction of kiln combustion air carried in with the fuel (ambient T)


cooler_air:
  cooling_air_rate_kg_per_kg_clinker: 2.2   # total cooler (fan) air, kg air / kg clinker

  # SUPERSEDED by fuel.kiln_fraction and no longer read.
  # Tertiary air is now the precalciner's own combustion air, so it is
  # the complement of the kiln's share of the total air rather than an
  # independent fraction of the cooler flow. Setting both would
  # over-determine the split and break the dry stack O2 target.
  tertiary_air_fraction: 0.28


motion:
  rpm_default: 1.5
  rpm_min: 1.0
  rpm_max: 3.0
  inclination_deg: 3.0


feed:
  Feed_rate_kg_s: 27.78   # 100000 kg/h clinker feed (SOLID INPUT)
  inventory_kg: 100000


operational:
  kiln_load: 1.0
  availability: 0.95
  bypass_ratio: 0.0
  false_air_ratio: 0.03
  calcination_degree_target: 0.92


logging:
  
  interval_sec: 60      # Temperature & control report interval [s]

checkpoint:
  enabled: true
  file: burning_ckpt.pkl

# ======================================================
# FAZ 5 -- ROTARY KILN HEAT TRANSFER CLOSURE
#
# These replace the per-zone literals hv_gs / hv_gw / hv_ws and the
# global radiation suppression factor k_eff = 0.005 in the two ROTATING
# zones (burning, transition). The calciner, preheater and cooler still
# use the old constants: they are not rotating cylinders -- a cyclone
# string and a grate -- so the rotary-kiln correlations do not apply to
# them and they are left for Faz 6.
#
# Every entry below is a MATERIAL or GEOMETRIC property, not a tuning
# knob. Nothing here was fitted to make the plant look right.
# ======================================================
kiln_closure:

  # Radiative properties of the two surfaces in the enclosure.
  # Cement raw meal and clinker are near-black in the infrared;
  # used refractory is slightly lower.
  bed_emissivity: 0.90
  wall_emissivity: 0.85

  # Bed properties for the covered-wall -> bed contact path
  # (physics.wall_bed_contact_coefficient, Li et al. 2005).
  # d_p is the only genuinely uncertain one: nodulised kiln feed
  # spans roughly 0.5-5 mm and the coefficient goes as 1/d_p in
  # the gas-gap leg, so it is stated here rather than buried.
  particle_diameter_m: 1.0e-3
  bed_conductivity: 0.4        # W/(m K), packed cement meal/clinker

  # Gas gap between the wall and the first particle layer, as a
  # multiple of d_p. Li et al. fit 0.096-0.198; this is the midpoint.
  # physics.wall_bed_contact_coefficient REJECTS values outside that
  # range rather than clamping them.
  contact_gap_chi: 0.147


# ======================================================
# FAZ 6 -- SHELL / REFRACTORY LOSS CLOSURE
#
# These replace the per-zone (refractory_thickness,
# refractory_conductivity, h_ext) triples and the
# insulation_factor = 0.27 calibration that physics.wall_losses
# carried. The loss is now a cylindrical layer stack closing on a
# SOLVED shell temperature, with natural convection AND radiation
# on the outer face (physics/shell.py).
#
# The live layer tables are DEFAULT_WALL_STACKS in
# physics/shell.py, next to the paragraph that justifies each
# entry -- they are not restated here, so there is one source and
# nothing to drift. This section exists to override them, per
# zone, when a specific plant is being modelled rather than the
# generic reference one. Anything left out keeps its default.
#
# Layers run HOT FACE OUTWARD as [name, thickness_m,
# conductivity_W_per_mK]. orientation is "horizontal" (rotary
# kiln shell, cooler casing) or "vertical" (calciner riser,
# preheater tower) and picks the Churchill & Chu form and the
# characteristic length.
#
# wall_stack:
#   burning:
#     orientation: horizontal
#     shell_emissivity: 0.80
#     layers:
#       - [clinker coating,       0.100,  1.00]
#       - [magnesia-spinel brick, 0.225,  2.80]
#       - [steel shell,           0.025, 45.00]
# ======================================================
