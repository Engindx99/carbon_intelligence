# Zone lengths [m]. Zones are laid end to end along the solid path
# (physics/axial_coordinate.py): preheater -> calciner -> transition
# -> burning -> cooler, z = 0 at the preheater feed inlet.
plant:
  N: 20
  length: 60.0   # m, burning zone length

transition:
  length: 25.0   # m

calciner:
  length: 25.0   # m

preheater:
  length: 25.0   # m, equivalent solid path length (stage volume sizing)
  nodes_per_stage: 20   # co-current heat-transfer nodes per cyclone stage (numerical)

cooler:
  length: 25.0   # m


simulation:
  dt: 0.05
  total_hours: 3.0
  chunk_hours: 1.0


fuel:
  Fuel_rate_total: 2.5
  O2: 3.5              # dry STACK O2 [%], sizing the plant's total combustion air

  # Share of the total fuel burned at the kiln burner; the rest fires
  # in the precalciner. In-line calciner (ILC) plants run 35-45% at the
  # kiln, so 0.40 is the mid-range literature value for the generic
  # reference kiln this config describes. Firing 100% at the kiln (the
  # previous behaviour) puts 3892 kJ/kg clinker into the kiln alone,
  # more than a whole plant's specific heat consumption.
  kiln_fraction: 0.40


burning:
  primary_air_fraction: 0.10   # fraction of kiln combustion air carried in with the fuel (ambient T)


cooler_air:
  cooling_air_rate_kg_per_kg_clinker: 2.2   # total cooler (fan) air, kg air / kg clinker

  # SUPERSEDED by fuel.kiln_fraction and no longer read.
  # Tertiary air is now the precalciner's own combustion air, so it is
  # the complement of the kiln's share of the total air rather than an
  # independent fraction of the cooler flow. Setting both would
  # over-determine the split and break the dry stack O2 target.
  tertiary_air_fraction: 0.28


motion:
  rpm_default: 1.5
  rpm_min: 1.0
  rpm_max: 3.0
  inclination_deg: 3.0


feed:
  Feed_rate_kg_s: 27.78   # 100000 kg/h clinker feed (SOLID INPUT)
  inventory_kg: 100000


operational:
  kiln_load: 1.0
  availability: 0.95
  bypass_ratio: 0.0
  false_air_ratio: 0.03
  calcination_degree_target: 0.92


logging:
  
  interval_sec: 60      # Temperature & control report interval [s]

checkpoint:
  enabled: true
  file: burning_ckpt.pkl

# ======================================================
# FAZ 5 -- ROTARY KILN HEAT TRANSFER CLOSURE
#
# These replace the per-zone literals hv_gs / hv_gw / hv_ws and the
# global radiation suppression factor k_eff = 0.005 in the two ROTATING
# zones (burning, transition). The calciner, preheater and cooler still
# use the old constants: they are not rotating cylinders -- a cyclone
# string and a grate -- so the rotary-kiln correlations do not apply to
# them and they are left for Faz 6.
#
# Every entry below is a MATERIAL or GEOMETRIC property, not a tuning
# knob. Nothing here was fitted to make the plant look right.
# ======================================================
kiln_closure:

  # Radiative properties of the two surfaces in the enclosure.
  # Cement raw meal and clinker are near-black in the infrared;
  # used refractory is slightly lower.
  bed_emissivity: 0.90
  wall_emissivity: 0.85

  # Bed properties for the covered-wall -> bed contact path
  # (physics.wall_bed_contact_coefficient, Li et al. 2005).
  # d_p is the only genuinely uncertain one: nodulised kiln feed
  # spans roughly 0.5-5 mm and the coefficient goes as 1/d_p in
  # the gas-gap leg, so it is stated here rather than buried.
  particle_diameter_m: 1.0e-3
  bed_conductivity: 0.4        # W/(m K), packed cement meal/clinker

  # Gas gap between the wall and the first particle layer, as a
  # multiple of d_p. Li et al. fit 0.096-0.198; this is the midpoint.
  # physics.wall_bed_contact_coefficient REJECTS values outside that
  # range rather than clamping them.
  contact_gap_chi: 0.147


# ======================================================
# FAZ 6 -- SHELL / REFRACTORY LOSS CLOSURE
#
# These replace the per-zone (refractory_thickness,
# refractory_conductivity, h_ext) triples and the
# insulation_factor = 0.27 calibration that physics.wall_losses
# carried. The loss is now a cylindrical layer stack closing on a
# SOLVED shell temperature, with natural convection AND radiation
# on the outer face (physics/shell.py).
#
# The live layer tables are DEFAULT_WALL_STACKS in
# physics/shell.py, next to the paragraph that justifies each
# entry -- they are not restated here, so there is one source and
# nothing to drift. This section exists to override them, per
# zone, when a specific plant is being modelled rather than the
# generic reference one. Anything left out keeps its default.
#
# Layers run HOT FACE OUTWARD as [name, thickness_m,
# conductivity_W_per_mK]. orientation is "horizontal" (rotary
# kiln shell, cooler casing) or "vertical" (calciner riser,
# preheater tower) and picks the Churchill & Chu form and the
# characteristic length.
#
# wall_stack:
#   burning:
#     orientation: horizontal
#     shell_emissivity: 0.80
#     layers:
#       - [clinker coating,       0.100,  1.00]
#       - [magnesia-spinel brick, 0.225,  2.80]
#       - [steel shell,           0.025, 45.00]
# ======================================================
