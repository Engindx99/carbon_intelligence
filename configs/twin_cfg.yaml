# Zone lengths [m]. Zones are laid end to end along the solid path
# (physics/axial_coordinate.py): preheater -> calciner -> transition
# -> burning -> cooler, z = 0 at the preheater feed inlet.
plant:
  N: 20

# ======================================================
# THE ROTARY TUBE
#
# One length for the whole rotary kiln, because that is the
# number a kiln actually has. The tube is the transition zone
# plus the burning zone; `transition.length` below splits it and
# the burning zone is whatever is left, so the two cannot drift
# apart. Named `kiln` rather than sitting under `plant`, which
# means the whole pyroprocess -- preheater through cooler.
# `diameter` is read by the burning and transition zones ONLY,
# because they are the one rotary tube; the calciner, preheater
# and cooler keep their own.
#
# THE 5000 t/d PLANT'S KILN (user decision, 12 Oct 2026). The
# plant is two identical 2500 t/d strings on one kiln, and the
# kiln is the published PF5000 one, taken by the same rule as the
# 2500 line's (geometry/kiln/kiln.md): the published shell 4.8 m
# as the bore, 74 m long, laid at 3 %.
#
# L/D is 15.4. That is past the "below 14:1" US4425092 gives an
# in-line calciner kiln (7:1-11:1 preferred, 15:1-17:1 for a
# conventional preheater kiln), the criterion the previous
# 4.5 x 60 m tube (L/D 13.33) was chosen against. The published
# 5000 t/d precalciner line is what it is; the patent is a
# design preference, and this plant does not meet it.
#
# The transition zone keeps the old 25/60 share of the tube:
# 30.83 m, the burning zone 43.17 m (user decision, 12 Oct 2026).
#
# Superseded: 4.5 x 60 m with a 25 m transition (L/D 13.33, the
# 2500-era twin, at 27.78 kg/s of meal); before that 46.2 m at
# L/D 11.00, chosen against a mis-stated Sullivan transit (see
# physics.rotary_bed_motion), and before that an 85 m tube.
#
# GEOMETRY IS NOT WRITTEN IN THIS FILE (single-source rule, user
# decision 13-14 Oct 2026). kiln.length / diameter, transition.length,
# motion.inclination_pct, calciner.length / diameter / zone_segments,
# preheater.strings / stages and cooler.length / width / casing_height
# come from geometry/plant_geometry.yaml through
# geometry/plant_geometry.py (TWIN_KEYS), put in by main.load_cfg; the
# loader refuses a config that writes one of them again.
kiln: {}

transition: {}

calciner:
  # The 5000 t/d plant's ILC, PF5000 (geometry/calciner/calciner.md):
  # its length (the vessel's height, cone + cylinder) and diameter come
  # from geometry/plant_geometry.yaml.

  # ======================================================
  # THE CALCINER IS A VERTICAL RISER. IT DOES NOT ROTATE.
  #
  # It used to carry slope_deg = 3.0, fill_fraction = 0.10 and
  # rpm = 3.0 hard-coded, put them through a ROTARY KILN transit
  # correlation, and read `state.rpm` -- the kiln's speed -- on
  # top, so turning the kiln faster moved the calciner's meal.
  # That gave a 670 s solids transit. An ILC calciner runs 2-5 s.
  #
  # What it does now is transport: u_s = u_g - u_t, the gas
  # velocity less the Stokes slip the particle's own weight costs
  # it (physics.suspension_transport). The suspension density
  # then follows from continuity, so there is no fill fraction
  # left to configure.
  #
  # These two are the only material properties that slip needs.
  # NOTE THE DENSITY: it is the mineral PARTICLE density, not the
  # ~1100 kg/m3 bulk density the zone carries as rho_s. Bulk
  # density already contains the void fraction of a settled heap,
  # which means nothing for a particle falling through gas, and
  # using it here would understate the slip by 2.5x.
  #
  # Cement raw meal is ground to 12-14 % residue on 90 um, so the
  # mass-mean particle is tens of microns. IT BARELY MATTERS, and
  # that is what makes this a mechanism and not a knob -- measured
  # on the converged calciner stream:
  #
  #   d_p     u_t          slip       transit
  #   10 um   0.0028 m/s   0.023 %     2.02 s
  #   25 um   0.0175 m/s   0.142 %     2.03 s
  #   50 um   0.0701 m/s   0.567 %     2.03 s
  #   90 um   0.2271 m/s   1.838 %     2.06 s
  #
  # Every defensible meal size lands within 2 % of the same
  # answer, and all of them inside the 2-5 s band.
  particle_diameter_m: 25.0e-6
  particle_density_kg_m3: 2700.0

  # C5, the calciner's OUTLET cyclone (plant topology, user decision
  # 13 Oct 2026; geometry/macros/plant_topology_2d.bas): meal from C4
  # enters the calciner, the calciner gas carries the calcined meal
  # up the gooseneck into the two C5s, and C5 drops it into the kiln
  # inlet chamber. One per string, the CFD C4 x 6.50/6.30:
  # geometry/preheater/cyclone_C5.md. Its escaping dust rises into C4
  # and comes back through C4's underflow
  # (pyroprocess/precalciner/c5_cyclone.py).
  # The loaded MM lower bound (0.895-0.900 at an even split), less what
  # the calciner's uneven meal split costs. The CFD at the twin's flows
  # (one-way DPM, 15 Oct 2026, geometry/calciner/calciner.md) sends 35 %
  # of the meal, mostly the fines, to string 1 and 65 %, nearly all the
  # coarse, to string 2. That holds whichever pipe the meal came from.
  # String 1's C5 then runs at c0 0.41 on fine meal (eta 0.81-0.82),
  # string 2's at c0 0.77 on coarse (0.94): -0.0085 weighted
  # (C:/Users/engin/c4/mm/c5_split.py; cyclone_C5.md). The twin still
  # solves one string, so only this mean reaches it.
  c5_separation_efficiency: 0.89

  # THE ZONE'S FLUID VOLUME (user decision, 13 Oct 2026): the calciner
  # zone runs from the vessel through the gooseneck to the C5s, gas and
  # meal co-current all the way, solved as ONE duct of the vessel's bore
  # whose equal-volume cells carry the segments in gas order; the fuel
  # burns in the vessel only. `zone_segments` (vessel, gooseneck to the
  # C5 inlets, C5s) is derived: plant_geometry.twin_sections.

preheater:
  # m, the zone's extent on the plant's axial coordinate only
  # (physics/axial_coordinate.py); the stage volumes are `stages` below.
  # 5 m per stage, four stages (C1-C4).
  length: 20.0
  # Co-current heat-transfer nodes per cyclone stage (numerical). 1 since
  # the node exchange is integrated exactly (54b88f6) with secant heat
  # capacities (c115873): 1 node puts every stage outlet within 2 K of
  # 20. Before that the node was a forward-Euler step, 1 node was 38 K
  # off and 20 was the default.
  nodes_per_stage: 1
  # Cyclone separation efficiencies, per cyclone at the CFD sizes. The
  # plant is two identical 2500 t/d strings (geometry/catalog.md, user
  # decision 12 Oct 2026); the twin solves the tower as one series string
  # at the total flow, which identical parallel strings with the same
  # eta reproduce exactly. Each value is the loaded Muschelknautz lower
  # bound at the string's flow, the rule the user chose for C1 on 4 Oct
  # 2026 (not the literature figures). 1.0 = no separation model.
  #
  # C1 (Stage 4, index N-1), twin C1s at ~28 kg/s gas each:
  # geometry/preheater/cyclone_C1.md "Tesis debisinde". Its dust is
  # caught by the filter and returned with the feed: it only costs heat.
  c1_separation_efficiency: 0.97
  # C2-C4 (Stages 3-1, indices 2-0), identical to the S 3.90 CFD C4 at
  # its own 56 kg/s: geometry/preheater/cyclone_C4.md. Their dust rises
  # with the gas into the stage above: an internal loop that moves heat,
  # not plant mass. C4's underflow is the calciner's meal.
  # Not the lower bound (0.93) but limit loading plus the inner vortex
  # from the S 3.90 clean-gas DPM (user decision, 14 Oct 2026): what
  # limit loading leaves, c0L/c0 = 0.068-0.074, is near-dilute, and the
  # DPM caught 48 % of it (in-domain parcels shared out as the rest):
  # 1 - 0.071 x 0.52 = 0.96.
  c2_c4_separation_efficiency: 0.96
  # C5 is the calciner's outlet cyclone, not a preheater stage:
  # `calciner.c5_separation_efficiency`.
  # THE STAGE FLUID VOLUMES (geometry/fluid_volumes.md; user decisions,
  # 13-14 Oct 2026). A twin stage is the riser below a cyclone, where
  # the co-current gas/meal exchange happens, plus the cyclone itself
  # (body + cone). R4..R2 are the CFD outlet pipes of C5..C3, R1 is
  # C2's outlet, R1 and the twin branches. Per string, times `strings`.
  # `strings` and `stages` are derived: plant_geometry.twin_sections.

pressure:
  # GAS-ONLY pressure losses, a REPORT (diagnostics D15, user decision
  # 14 Oct 2026): nothing feeds back into the solve. Each section's
  # Euler number is its CFD's dP / (1/2 rho v^2), carried to the
  # twin's flow and temperature at the same reference velocity.
  # Loading lowers a cyclone's dP (loaded MM: C4 ~0.76x, C1 ~0.48x)
  # and adds the risers' hold-up and acceleration; neither is here.
  #
  # Calciner + gooseneck to the CFD outlet faces: total-pressure loss
  # 180.9 Pa over the vessel's superficial velocity of its outlet gas
  # (392.9 m3/s at 1209 K on the 35.68 m2 bore, 1/2 rho v^2 17.96 Pa).
  # Two inlets mix there, so the split between the kiln-gas and the
  # tertiary-air paths depends on their flow ratio and does not carry
  # (geometry/calciner/calciner.md, CFD section).
  calciner_euler: 10.07
  # Cyclones, static dP over the inlet duct's velocity: C1
  # (geometry/preheater/cyclone_C1.md, plant flow), C4 with the 1.70 D_x
  # outlet (cyclone_C4.md). C2, C3 and C5 are C4's geometric twins.
  c1_euler: 6.35
  c4_euler: 11.54

cooler:
  # THE GRATE (geometry/cooler/cooler.md; user decision, 13 Oct
  # 2026). The fluid volume is a box, width x length x casing
  # height, with the clinker bed as its bottom slice; it replaces
  # the 4.2 m x 25 m rotary cylinder this zone carried as a
  # placeholder.
  #
  #   length         the PF5000 grate area 119.6 m2 / width
  #   width          FLS reference cooler, Svensen et al. 2024
  #                  (arXiv:2409.09076): "36 m long ... 4 m width
  #                  and 3 m tall"
  #   casing_height  the same: grate to roof, bed and air above it
  #   bed_porosity   the same paper's 0.4
  #   solid_density  its Table II on its clinker (79.96 / 9.76 /
  #                  10.28 % C3S / C3A / C4AF, C4AF 3.8 g/cm3),
  #                  mass-weighted harmonic mean [kg/m3]
  #   grate_speed    the OPERATOR's input. The design bed is the
  #                  FLS one, 53.06 kg/s / (rho_bulk 4.0 0.017) =
  #                  0.409 m, and this speed carries 5000 t/d
  #                  (57.87 kg/s) at that depth; residence 26.9 min
  #                  (FLS 36). The bed depth then follows the
  #                  clinker flow, h = m_dot / (rho_bulk w v).
  # length, width, casing_height: geometry/plant_geometry.yaml
  bed_porosity: 0.4
  solid_density: 3178.0 # kg/m3
  grate_speed_m_s: 0.01854

  # Clinker nodule diameter, for the packed-bed specific surface
  # 6(1-eps)/d_p that sets the gas->solid contact area the cooling
  # air sees. The cooler used to pass its 4.2 m VESSEL diameter
  # into that d_p -- the same substitution
  # pyroprocess/burning/heat_transfer.py:133-138 documents and
  # fixed for the kiln.
  #
  # Clinker leaves a kiln nodulised at roughly 10-25 mm, and a
  # grate passes up to ~25 mm before the crusher. 15 mm is the
  # middle of that. The real distribution is wide (dust below
  # 0.5 mm can be 1-70%), so this is a stand-in for a whole PSD.
  #
  # IT DOES NOT MATTER MUCH, AND THAT IS THE POINT. MEASURED on
  # the converged plant by scaling a_gs directly:
  #
  #   a_gs x     NTU    secondary air   clinker discharge
  #      1      1.20       717.81 K         462.06 K
  #     10     12.29       912.55 K         363.94 K
  #     25     30.79       934.47 K         356.89 K
  #    100    123.34       946.13 K         353.41 K
  #
  # Ten-fold in area moves secondary air 33.6 K. 15 mm is a 280x
  # correction, far onto that plateau, and so is every other
  # defensible nodule size -- 5 mm and 25 mm land within a few K
  # of each other. This is a mechanism being corrected, not a
  # parameter being fitted, and the plateau is what makes that
  # checkable rather than assertable (see
  # tests/test_cooler_contact_area.py).
  #
  # That table was measured on the 4.2 m cylinder placeholder. On
  # the grate (13 Oct 2026) the area acts over the bed only, ~1/6
  # of the old volume: NTU 43, still on the plateau, secondary air
  # 1060 K. The FLS cooler paper gives d_p ~40 mm; moving to it
  # belongs with the packed-bed heat-transfer closure, not here.
  particle_diameter_m: 0.015


simulation:
  dt: 0.05
  total_hours: 3.0
  chunk_hours: 1.0

  # Picard sweep budget for the steady-state solve (main.Twin.run).
  # It is a BUDGET, not an answer -- the loop exits on the same
  # tolerance whatever this is set to.
  #
  # Measured 2026-09-19: 71 sweeps at nodes_per_stage=1, 67 at 20,
  # so 100 carried ~40% margin.
  #
  # Measured 2026-09-20, shortening the rotary tube: 101 sweeps at
  # 60 m, 94 at the committed 46.2 m. The 60 m case missed the old
  # budget of 100 by ONE sweep, with thermal 5.771e-07 K, mass
  # 1.421e-14 kg/s and solid_handoff 4.521e-04 W -- every
  # criterion met, nothing diverging.
  #
  # That is the same near-miss the preheater inner loop had at 51
  # against a budget of 50 (pyroprocess/preheater/heat_transfer.py)
  # and it is worth saying twice: a run that hits the cap is
  # reporting budget exhaustion, which looks identical to a
  # divergence from outside and is not one. Check the residual
  # trajectory before raising this OR before calling it a failure.
  #
  # 150 was ~60% margin over the measured 94.
  #
  # Measured 13 Oct 2026, C5 moved to the calciner's outlet (four
  # preheater stages): converges in 161 sweeps, monotonically, at
  # ~0.89 per sweep (1.0e-07 K at 150; the burning zone sets the
  # rate, the cause is not isolated).
  # 250 is ~55% margin over that.
  max_iterations: 250


fuel:
  # The middle of the specific heat consumption band (user decision,
  # 13 Oct 2026): SHC_BAND 2900-3300 kJ/kg clinker in
  # reporter/diagnostics.py, so 3100 kJ/kg on the clinker the meal can
  # make, at LHV 32 MJ/kg. A fixed operating input, not a control loop.
  #
  # The clinker is the feed's, from its composition
  # (chemistry/composition.py): 89.70 kg/s meal less its water (free
  # and bound) and the CaCO3's CO2,
  #
  #   89.70 x (1 - 3000/96000 - 73000/96000 x 44.01/100.09) = 56.90 kg/s
  #
  # so 3100e3 x 56.90 / 32e6 = 5.513 kg/s (tests/test_fuel_basis.py).
  #
  # Was 5.29 (15 Oct 2026): the same 3100 kJ/kg on a 54.63 kg/s clinker
  # potential that still held the clay's bound water, which the model
  # then left in the clinker. With the water released (dehydroxylation
  # in the preheater) the real clinker is 56.90 kg/s and 5.29 was
  # 2975 kJ/kg. Against the VDZ reference plant the calciner was the
  # side short of it: meal to the kiln 74 % calcined, 87 % with this.
  #
  # Was 8.07 (4460 kJ/kg) before 13 Oct 2026: the 2500-era fuel per kg
  # of meal, scaled with the feed on 12 Oct 2026. It only ran because
  # the old calcination kinetics had the calciner self-heat to 1580 K;
  # with calcination finishing in the calciner, the kiln got ~30 MW
  # more than its bed can take and ran to 2400-2900 K.
  Fuel_rate_total: 5.513
  O2: 3.5              # dry STACK O2 [%], sizing the plant's total combustion air

  # Share of the total fuel burned at the kiln burner; the rest fires
  # in the precalciner. The VDZ BAT reference plant (CEMCAP D3.2 rev 2,
  # zenodo.org/records/1257112, Tables 3.7 and 3.5): 39.895 MW at the
  # kiln, 65.160 MW in the calciner, 39.895 / 105.055 = 0.380. The kiln
  # then burns 1178 kJ/kg (VDZ 1149; the FLS reference scenario 1256,
  # Svensen et al. 2025, arXiv:2504.02886, sec. 4.3).
  #
  # Was 0.40, the middle of the 35-45 % ILC range, without a plant
  # behind it. Firing 100% at the kiln (the behaviour before that) put
  # 3892 kJ/kg clinker into the kiln alone, more than a whole plant's
  # specific heat consumption.
  kiln_fraction: 0.380

  # The kiln burner's combustion air: the air that leaves the kiln
  # flame's products at this O2 [vol %, wet] (gas_thermo.air_for_wet_O2).
  # The VDZ BAT reference plant's kiln gas E-100 carries 1.5 % O2 wet
  # (CEMCAP D3.2 rev 2, Table 3.9). The calciner gets the rest of the
  # plant air, which is still sized from the stack O2 above.
  # That 1.5 % is measured on the whole kiln gas, which also holds the
  # kiln's calcination CO2 and false air; here it is applied to the
  # burner's products alone. Neither is modelled in the kiln.
  # Before 15 Nov 2026 the kiln got kiln_fraction of the plant air
  # (the same excess air as the stack), about 3.1 % O2 wet and a
  # secondary air of 0.46 kg/kg clinker against VDZ's 0.30.
  kiln_O2_wet: 1.5


burning:
  primary_air_fraction: 0.10   # fraction of kiln combustion air carried in with the fuel (ambient T)

  # Share of the kiln's combustion air that LEAKS in cold through the
  # kiln outlet (hood-side) seal instead of arriving hot from the
  # cooler (16 Nov 2026). The kiln's total air is still fixed by
  # fuel.kiln_O2_wet, so the leak displaces secondary air.
  # Derived from the VDZ BAT reference kiln (CEMCAP D3.2 rev 2,
  # zenodo 1257112): the N2 of the kiln gas E-100 (61 411 kg/h,
  # 70.5 % N2, Table 3.9) is 14.76 kg/s of air; the cooler's
  # secondary air (0.23 Nm3/kg clinker, Table 3.8) is 10.33 kg/s
  # and this model's primary air 10 % (1.48 kg/s), leaving
  # 2.96 kg/s = 0.200 of the kiln air (0.085 kg/kg clinker)
  # entering at ambient temperature. Cross-check: D3.2 section
  # 3.8.2 gives ~6 % false air (dry volume) at the preheater outlet
  # of a BAT plant after maintenance, rising to ~10 % as the
  # rotating-part seals wear over the year. NOT modelled: the kiln
  # INLET seal (it leaks into the riser, which E-100 does not
  # resolve), the preheater and the calciner (~0 in VDZ's E-200).
  kiln_seal_air_fraction: 0.20


cooler_air:
  cooling_air_rate_kg_per_kg_clinker: 2.2   # total cooler (fan) air, kg air / kg clinker

  # SUPERSEDED by fuel.kiln_fraction and no longer read.
  # Tertiary air is now the precalciner's own combustion air, so it is
  # the complement of the kiln's share of the total air rather than an
  # independent fraction of the cooler flow. Setting both would
  # over-determine the split and break the dry stack O2 target.
  tertiary_air_fraction: 0.28


# ======================================================
# HOW THE TUBE TURNS
#
# These three set the solid transit through the kiln, and the
# transit is the constraint: a modern precalciner system runs
# 25-35 min. physics.rotary_bed_motion gives
#
#   tau = 1.77 L sqrt(theta) / (D N beta)      [minutes]
#
# so at a fixed L and D the band fixes the product N*beta and
# nothing else -- rpm and slope are ONE handle for the transit,
# with rpm entering a second and much weaker time through the
# rotational Reynolds number in nusselt_gas_bed (about -13 K on
# the bed from 3.0 to 4.0 rpm at fixed tau).
#
# 3.5 rpm and 3 % give tau = 28.70 min over the 74 m, 4.8 m tube
# (PF5000; geometry/kiln/kiln.md). The PF5000 drive turns it at
# 0.6-4.0 rpm, so the band's 25-35 min is 2.87-4.0 rpm.
#
# Superseded: the 2500-era 4.5 x 60 m tube at 3.5 rpm and 2.2 %
# gave 33.84 min, and the band's faster half broke the 1773 K
# clinker liquidus there because that plant burnt 4440 kJ/kg
# clinker against SHC_BAND = (2900, 3300). The fuel now sits at
# the band's middle (`fuel:` below, 13 Oct 2026).
#
# The slope is a PERCENT, which is how a kiln is built and
# quoted. It used to read `inclination_deg: 3.0` -- 5.24 %,
# outside the 2-4 % a cement kiln is laid on, and the unit
# confusion is exactly the one Sullivan's correlation invites,
# since it takes the inclination in DEGREES (1.72 deg here).
motion:
  rpm_default: 3.5
  rpm_min: 0.6             # PF5000 drive (geometry/kiln/kiln.md)
  rpm_max: 4.0
  # inclination_pct: the kiln's slope, geometry/plant_geometry.yaml
  # (3 % = 1.71836 deg; tau = 28.70 min)

  # Dynamic angle of repose of the kiln bed [degrees]. A MATERIAL
  # property, read only by physics.rotary_bed_motion, where it is
  # the sqrt(theta) in Sullivan's numerator.
  #
  # The cement industry quotes the same correlation with theta
  # already folded into a constant -- t = 11.2 L/(r D s) -- and
  # 1.77*sqrt(40) = 11.194, i.e. that shorthand IS theta = 40 deg
  # to within 0.1%. The US Bureau of Mines foot-and-RPH form
  # implies 37.8 deg on the same arithmetic. 40 is stated
  # directly in the cement-industry literature for raw material
  # and is the value the most-used constant encodes.
  repose_angle_deg: 40.0


feed:
  # Raw meal [kg/s] (SOLID INPUT). The plant is 5000 t/d of clinker:
  # two identical 2500 t/d strings (geometry/catalog.md, user decision
  # 12 Oct 2026). Meal = 1.55 x clinker, the literature basis the
  # geometry was sized on (geometry/preheater/cyclone_C4.md), not the
  # twin's own meal/clinker ratio, which under-calcination inflates.
  # Was 27.78 (100 t/h of meal; the old comment called it clinker).
  Feed_rate_kg_s: 89.70
  inventory_kg: 100000


operational:
  kiln_load: 1.0
  availability: 0.95
  bypass_ratio: 0.0
  false_air_ratio: 0.03
  calcination_degree_target: 0.92


logging:
  
  interval_sec: 60      # Temperature & control report interval [s]

checkpoint:
  enabled: true
  file: burning_ckpt.pkl

# ======================================================
# FAZ 5 -- ROTARY KILN HEAT TRANSFER CLOSURE
#
# These replace the per-zone literals hv_gs / hv_gw / hv_ws and the
# global radiation suppression factor k_eff = 0.005 in the two ROTATING
# zones (burning, transition). The calciner, preheater and cooler still
# use the old constants: they are not rotating cylinders -- a cyclone
# string and a grate -- so the rotary-kiln correlations do not apply to
# them and they are left for Faz 6.
#
# Every entry below is a MATERIAL or GEOMETRIC property, not a tuning
# knob. Nothing here was fitted to make the plant look right.
# ======================================================
kiln_closure:

  # Radiative properties of the two surfaces in the enclosure.
  # Cement raw meal and clinker are near-black in the infrared;
  # used refractory is slightly lower.
  bed_emissivity: 0.90
  wall_emissivity: 0.85

  # Bed properties for the covered-wall -> bed contact path
  # (physics.wall_bed_contact_coefficient, Li et al. 2005).
  # d_p is the only genuinely uncertain one: nodulised kiln feed
  # spans roughly 0.5-5 mm and the coefficient goes as 1/d_p in
  # the gas-gap leg, so it is stated here rather than buried.
  particle_diameter_m: 1.0e-3
  bed_conductivity: 0.4        # W/(m K), packed cement meal/clinker

  # Gas gap between the wall and the first particle layer, as a
  # multiple of d_p. Li et al. fit 0.096-0.198; this is the midpoint.
  # physics.wall_bed_contact_coefficient REJECTS values outside that
  # range rather than clamping them.
  contact_gap_chi: 0.147


# ======================================================
# FAZ 6 -- SHELL / REFRACTORY LOSS CLOSURE
#
# These replace the per-zone (refractory_thickness,
# refractory_conductivity, h_ext) triples and the
# insulation_factor = 0.27 calibration that physics.wall_losses
# carried. The loss is now a cylindrical layer stack closing on a
# SOLVED shell temperature, with natural convection AND radiation
# on the outer face (physics/shell.py).
#
# The live layer tables are DEFAULT_WALL_STACKS in
# physics/shell.py, next to the paragraph that justifies each
# entry -- they are not restated here, so there is one source and
# nothing to drift. This section exists to override them, per
# zone, when a specific plant is being modelled rather than the
# generic reference one. Anything left out keeps its default.
#
# Layers run HOT FACE OUTWARD as [name, thickness_m,
# conductivity_W_per_mK] or [name, thickness_m, k, rho_kg_per_m3,
# cp_J_per_kgK]; the kiln zones (burning, transition) need rho and
# cp, their wall mass is the stack's own. By default the kiln's
# thicknesses come from geometry/plant_geometry.yaml (kiln.shell_t,
# lining_t, *_coating_t). orientation is "horizontal" (rotary
# kiln shell, cooler casing) or "vertical" (calciner riser,
# preheater tower) and picks the Churchill & Chu form and the
# characteristic length.
#
# wall_stack:
#   burning:
#     orientation: horizontal
#     shell_emissivity: 0.80
#     layers:
#       - [clinker coating,       coating_burning,  0.74, 2800.0, 850.0]
#       - [magnesia-spinel brick, brick,            3.00, 2930.0, 950.0]
#       - [steel shell,           steel_shell,     45.00, 7850.0, 480.0]
# (a kiln thickness written as a NUMBER here bypasses the yaml's
# kiln lining -- keep the keys unless that is the point)
# ======================================================
